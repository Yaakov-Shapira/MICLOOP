            </div>
            <canvas ref={canvasRef} width={320} height={72} style={{borderRadius:'12px',background:'rgba(10,20,46,.55)',border:'1px solid rgba(10,132,255,.12)',position:'relative',zIndex:10}}/>
            <div style={{marginTop:'8px',fontSize:'11px',fontWeight:300,color:muted?'#FF3B30':'rgba(71,161,255,.60)',position:'relative',zIndex:10}}>{muted?'מושתק':'שידור פעיל'}</div>
          </>
        ) : (
          <>
            <div style={{position:'absolute',width:'310px',height:'310px',borderRadius:'50%',background:'radial-gradient(circle,rgba(10,132,255,.18) 0%,transparent 70%)',pointerEvents:'none'}}/>
            {[{s:106,d:'0s',a:.50},{s:152,d:'.9s',a:.26},{s:198,d:'1.8s',a:.14},{s:244,d:'2.7s',a:.07}].map(({s,d,a},i)=>(
              <div key={i} style={{position:'absolute',width:s,height:s,borderRadius:'50%',border:`1px solid rgba(10,132,255,${a})`,animation:'ring-expand 3.6s ease-out infinite',animationDelay:d}}/>
            ))}
            <div style={{width:'88px',height:'88px',borderRadius:'50%',background:'linear-gradient(135deg,rgba(10,132,255,.26),rgba(8,50,160,.16))',border:'1px solid rgba(10,132,255,.38)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'40px',lineHeight:1,position:'relative',zIndex:10,boxShadow:'0 0 38px rgba(10,132,255,.26)'}}>{loop.host?.avatar||'🎙'}</div>
            <div style={{marginTop:'12px',fontSize:'14px',fontWeight:600,color:'#fff',position:'relative',zIndex:10}}>{loop.host?.name||'מארח'}</div>
            <div style={{fontSize:'10px',fontWeight:300,color:'rgba(90,140,255,.60)',position:'relative',zIndex:10,marginTop:'2px'}}>מארח</div>
          </>
        )}

        {/* Floating emojis */}
        {floatEmojis.map(e => (
          <div key={e.id} className="emoji-float" style={{bottom:'60px',left:`${e.x}%`}}>{e.emoji}</div>
        ))}
      </div>

      {/* Listener count */}
      <div style={{textAlign:'center',fontSize:'12.5px',fontWeight:300,color:'rgba(130,155,195,.55)',padding:'6px 0 10px',flexShrink:0}}>
        🎧 {(loop.listeners||0).toLocaleString()} מאזינים
      </div>

      {/* HOST: MUSIC PANEL */}
      {isHost && (
        <div style={{margin:'0 14px 10px',flexShrink:0,background:'rgba(10,20,46,0.65)',backdropFilter:'blur(22px) saturate(150%)',WebkitBackdropFilter:'blur(22px) saturate(150%)',border:'1px solid rgba(10,132,255,0.13)',borderRadius:'18px',padding:'13px 15px 10px',display:'flex',flexDirection:'column',gap:'9px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:'10px',fontWeight:700,letterSpacing:'1.6px',textTransform:'uppercase',color:'rgba(71,161,255,0.72)'}}>🎵 מוזיקת רקע</span>
            <button onClick={toggleDuck} style={{
              padding:'3px 10px',borderRadius:'999px',cursor:'pointer',
              fontSize:'9.5px',fontWeight:700,letterSpacing:'0.8px',transition:'all .22s',
              background:duckEnabled?'rgba(52,199,89,0.14)':'rgba(255,255,255,0.06)',
              border:duckEnabled?'1px solid rgba(52,199,89,0.36)':'1px solid rgba(255,255,255,0.10)',
              color:duckEnabled?'#34C759':'rgba(140,155,180,0.60)',
              boxShadow:duckEnabled?'0 0 8px rgba(52,199,89,0.18)':'none',
            }}>{duckEnabled?'🎤 DUCK ON':'🎤 DUCK OFF'}</button>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{flex:1,overflow:'hidden',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'8px',padding:'5px 10px',fontSize:'11px',fontWeight:400,color:'rgba(180,200,230,0.75)',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{bgTrackName}</div>
            <button onClick={()=>fileInputRef.current?.click()} style={{padding:'5px 11px',borderRadius:'8px',cursor:'pointer',flexShrink:0,background:'rgba(10,132,255,0.10)',border:'1px solid rgba(10,132,255,0.26)',fontSize:'11px',fontWeight:600,color:'#4DA8FF',transition:'all .18s'}}>📁 העלה</button>
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <button onClick={bgPlaying?pauseBg:playBg} style={{
              flex:1,padding:'9px',borderRadius:'10px',cursor:'pointer',
              fontSize:'12.5px',fontWeight:600,transition:'all .2s',
              background:bgPlaying?'rgba(10,132,255,0.22)':'rgba(10,132,255,0.09)',
              border:`1px solid rgba(10,132,255,${bgPlaying?'.52':'.26'})`,
              color:'#4DA8FF',boxShadow:bgPlaying?'0 0 14px rgba(10,132,255,0.28)':'none',
            }}>{bgPlaying?'⏸ השהה':bgPaused?'▶ המשך':'▶ נגן'}</button>
            <button onClick={stopBg} disabled={!canStop} style={{
              width:'42px',borderRadius:'10px',cursor:canStop?'pointer':'default',
              fontSize:'14px',transition:'all .2s',
              background:canStop?'rgba(255,59,48,0.12)':'rgba(255,255,255,0.04)',
              border:canStop?'1px solid rgba(255,59,48,0.30)':'1px solid rgba(255,255,255,0.07)',
              color:canStop?'#FF453A':'rgba(140,155,180,0.28)',
            }}>⏹</button>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <span style={{fontSize:'14px',flexShrink:0,lineHeight:1,opacity:isDucked?0.45:1,transition:'opacity .3s'}}>{volIcon}</span>
            <input type="range" className="vol-slider" min="0" max="1" step="0.02"
              value={bgVolume} onChange={handleVol}
              style={{flex:1,opacity:isDucked?0.42:1,transition:'opacity .3s'}}
            />
            <span style={{fontSize:'10.5px',fontWeight:500,flexShrink:0,minWidth:'34px',textAlign:'right',fontVariantNumeric:'tabular-nums',transition:'color .3s',color:isDucked?'rgba(255,204,0,0.75)':'rgba(100,140,190,0.55)'}}>
              {isDucked?'↓15%':`${Math.round(bgVolume*100)}%`}
            </span>
          </div>
          {isDucked && (
            <div style={{display:'flex',alignItems:'center',gap:'7px',background:'rgba(255,204,0,0.08)',border:'1px solid rgba(255,204,0,0.22)',borderRadius:'999px',padding:'5px 12px'}}>
              <div style={{width:'6px',height:'6px',borderRadius:'50%',background:'#FFCC00',flexShrink:0,animation:'blink 1.1s ease-in-out infinite'}}/>
              <span style={{fontSize:'10.5px',fontWeight:500,color:'rgba(255,204,0,0.85)'}}>מזהה דיבור — מוזיקה הונחתה ל-15%</span>
            </div>
          )}
        </div>
      )}

      {/* REACTIONS ROW (listener only) */}
      {!isHost && (
        <div style={{display:'flex',justifyContent:'center',gap:'14px',padding:'4px 20px 8px',flexShrink:0}}>
          {['👍','🔥','👏'].map(emoji => (
            <button key={emoji} onClick={()=>sendReaction(emoji)} style={{
              width:'44px',height:'44px',borderRadius:'50%',cursor:'pointer',
              background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.10)',
              fontSize:'20px',display:'flex',alignItems:'center',justifyContent:'center',
              transition:'transform .12s, background .15s',
            }}
              onMouseDown={e=>e.currentTarget.style.transform='scale(0.88)'}
              onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
            >{emoji}</button>
          ))}
        </div>
      )}

      {/* BOTTOM BAR */}
      <div style={{display:'flex',gap:'10px',padding:'12px 20px 24px',flexShrink:0,borderTop:'1px solid rgba(255,255,255,.04)',background:'rgba(0,0,0,.40)'}}>
        {isHost ? (
          <>
            <button onClick={toggleMute} style={{
              flex:1,
              background:muted?'rgba(255,59,48,.12)':'rgba(255,255,255,.06)',
              border:muted?'1px solid rgba(255,59,48,.30)':'1px solid rgba(255,255,255,.09)',
              borderRadius:'999px',padding:'13px',fontSize:'13px',fontWeight:600,
              color:muted?'#FF3B30':'rgba(200,215,240,.70)',cursor:'pointer',transition:'all .22s',
            }}>{muted?'🔇 מושתק':'🎙 מיק פעיל'}</button>
            <button onClick={endLoop} style={{
              flex:1,
              background:'rgba(255,59,48,.10)',border:'1px solid rgba(255,59,48,.26)',
              borderRadius:'999px',padding:'13px',fontSize:'13px',fontWeight:700,
              color:'#FF3B30',cursor:'pointer',transition:'all .22s',
            }}>⏹ סיים לופ</button>
          </>
        ) : (
          <>
            <button onClick={()=>setRaised(r=>!r)} style={{
              flex:1,
              background:raised?'rgba(255,204,0,.12)':'rgba(255,255,255,.05)',
              border:raised?'1px solid rgba(255,204,0,.32)':'1px solid rgba(255,255,255,.08)',
              borderRadius:'999px',padding:'13px',fontSize:'13px',fontWeight:500,
              color:raised?'#FFCC00':'rgba(175,188,210,.68)',cursor:'pointer',transition:'all .22s',
            }}>{raised?'✋ מחכה...':'✋ הרם יד'}</button>
            <button onClick={()=>requestExit('leave')} style={{
              flex:1,
              background:'rgba(255,59,48,.09)',border:'1px solid rgba(255,59,48,.24)',
              borderRadius:'999px',padding:'13px',fontSize:'13px',fontWeight:600,
              color:'#FF3B30',cursor:'pointer',transition:'all .22s',
            }}>עזוב</button>
          </>
        )}
      </div>

      {/* ── CHAT PANEL ── */}
      {chatOpen && (
        <div style={{
          position:'absolute', bottom:0, left:0, right:0,
          height:'62%', background:'rgba(5,9,20,0.98)',
          borderTop:'1px solid rgba(255,255,255,0.08)',
          borderRadius:'22px 22px 0 0',
          display:'flex',flexDirection:'column',
          zIndex:600, animation:'slide-up .26s ease',
          backdropFilter:'blur(30px)', WebkitBackdropFilter:'blur(30px)',
        }}>
          {/* Chat header */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px 10px',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
            <span style={{fontSize:'14px',fontWeight:700,color:'#fff'}}>💬 צ׳אט</span>
            <button onClick={()=>setChatOpen(false)} style={{width:'28px',height:'28px',borderRadius:'50%',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.10)',color:'rgba(160,180,220,0.55)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px'}}>✕</button>
          </div>
          {/* Messages */}
          <div ref={chatListRef} style={{flex:1,overflowY:'auto',padding:'10px 16px',display:'flex',flexDirection:'column',gap:'10px',scrollbarWidth:'none'}}>
            {messages.map(m => (
              <div key={m.id} style={{display:'flex',gap:'8px',alignItems:'flex-start'}}>
                <div style={{width:'28px',height:'28px',borderRadius:'50%',background:'rgba(10,132,255,0.14)',border:'1px solid rgba(10,132,255,0.22)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',flexShrink:0}}>
                  {m.name.charAt(0)}
                </div>
                <div>
                  <div style={{fontSize:'10px',fontWeight:600,color:'rgba(100,140,200,0.65)',marginBottom:'2px'}}>
                    {m.name}&nbsp;<span style={{fontWeight:300,color:'rgba(100,130,180,0.38)'}}>{m.time}</span>
                  </div>
                  <div style={{fontSize:'13px',fontWeight:400,color:'rgba(220,230,245,0.85)',lineHeight:1.45}}>{m.text}</div>
                </div>
              </div>
            ))}
          </div>
          {/* Input */}
          <div style={{display:'flex',gap:'8px',padding:'10px 14px 16px',borderTop:'1px solid rgba(255,255,255,0.05)'}}>
            <input
              value={msgInput}
              onChange={e=>setMsgInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&sendMsg()}
              placeholder="כתוב הודעה..."
              style={{
                flex:1,background:'rgba(255,255,255,0.05)',
                border:'1px solid rgba(255,255,255,0.10)',borderRadius:'12px',
                padding:'10px 14px',fontSize:'13px',color:'#fff',
                outline:'none',fontFamily:'var(--font)',
              }}
            />
            <button onClick={sendMsg} disabled={!msgInput.trim()} style={{
              width:'40px',height:'40px',borderRadius:'12px',flexShrink:0,cursor:'pointer',
              background:'rgba(10,132,255,0.18)',border:'1px solid rgba(10,132,255,0.36)',
              color:'#4DA8FF',fontSize:'16px',display:'flex',alignItems:'center',justifyContent:'center',
              opacity:msgInput.trim()?1:0.4,transition:'opacity .15s',
            }}>➤</button>
          </div>
        </div>
      )}

      {/* ── GATE MODAL ── */}
      {gateMsg && <GateModal msg={gateMsg} onClose={()=>setGateMsg(null)} onGoProfile={()=>{setGateMsg(null); onLeave&&onLeave(); onGoProfile&&onGoProfile();}}/>}

      {/* ── RATING MODAL ── */}
      {showRating && (
        <div style={{
          position:'absolute',inset:0,
          display:'flex',alignItems:'center',justifyContent:'center',
          background:'rgba(0,0,0,0.75)',zIndex:800,
          animation:'fade-in .22s ease',
        }}>
          <div style={{
            background:'rgba(8,13,28,0.99)',border:'1px solid rgba(255,255,255,0.10)',
            borderRadius:'24px',padding:'28px 26px 22px',
            width:'88%',maxWidth:'320px',
            backdropFilter:'blur(30px)',WebkitBackdropFilter:'blur(30px)',
            animation:'slide-up .26s ease',textAlign:'center',
          }}>
            <div style={{fontSize:'32px',marginBottom:'10px'}}>⭐</div>
            <div style={{fontSize:'16px',fontWeight:700,color:'#fff',marginBottom:'4px'}}>
              {exitTypeRef.current==='end'?'סיימת את הלופ':'איך היה הלופ?'}
            </div>
            <div style={{fontSize:'12px',fontWeight:300,color:'rgba(130,155,200,0.60)',marginBottom:'20px'}}>
              {exitTypeRef.current==='end'?'תן דירוג לשידור שלך':'דרג את חוויית ההאזנה'}
            </div>
            {/* Stars */}
            <div style={{display:'flex',justifyContent:'center',gap:'10px',marginBottom:'22px'}}>
              {[1,2,3,4,5].map(n => (
                <button key={n} onClick={()=>setRating(n)} style={{
                  fontSize:'28px',background:'none',border:'none',cursor:'pointer',
                  opacity:n<=rating?1:0.25,
                  transform:n<=rating?'scale(1.15)':'scale(1)',
                  transition:'all .15s',
                }}>★</button>
              ))}
            </div>
            {/* Actions */}
            <div style={{display:'flex',gap:'10px'}}>
              <button onClick={()=>{setShowRating(false); onLeave&&onLeave(); if(exitTypeRef.current==='end')endLoop();}} style={{
                flex:1,padding:'12px',borderRadius:'12px',cursor:'pointer',
                background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.09)',
                fontSize:'13px',fontWeight:500,color:'rgba(150,170,210,0.60)',
              }}>דלג</button>
              <button onClick={confirmExit} disabled={rating===0} style={{
                flex:2,padding:'12px',borderRadius:'12px',cursor:rating===0?'default':'pointer',
                background:'linear-gradient(135deg,rgba(10,132,255,.26),rgba(0,60,220,.18))',
                border:'1px solid rgba(10,132,255,.42)',
                fontSize:'13px',fontWeight:700,color:'#fff',
                opacity:rating===0?0.45:1,transition:'opacity .15s',
              }}>שלח דירוג ✓</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   § GATE MODAL — generic registration prompt
   ══════════════════════════════════════════════════════════════ */
function GateModal({ msg, onClose, onGoProfile }) {
  return (
    <div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.74)',zIndex:900,animation:'fade-in .2s ease'}}>
      <div style={{background:'rgba(8,13,28,0.99)',border:'1px solid rgba(255,255,255,0.10)',borderRadius:'22px',padding:'26px 24px 20px',width:'84%',maxWidth:'310px',textAlign:'center',animation:'slide-up .25s ease'}}>
        <div style={{fontSize:'30px',marginBottom:'10px'}}>🔒</div>
        <div style={{fontSize:'15px',fontWeight:700,color:'#fff',marginBottom:'6px'}}>נדרש רישום</div>
        <div style={{fontSize:'12px',fontWeight:300,color:'rgba(130,155,200,0.65)',marginBottom:'22px',lineHeight:1.6}}>{msg}</div>
        <div style={{display:'flex',gap:'10px'}}>
          <button onClick={onClose} style={{flex:1,padding:'11px',borderRadius:'12px',cursor:'pointer',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.09)',fontSize:'13px',color:'rgba(150,170,210,0.60)'}}>סגור</button>
          <button onClick={onGoProfile} style={{flex:2,padding:'11px',borderRadius:'12px',cursor:'pointer',background:'linear-gradient(135deg,rgba(10,132,255,.26),rgba(0,60,220,.18))',border:'1px solid rgba(10,132,255,.40)',fontSize:'13px',fontWeight:700,color:'#fff'}}>לרישום מהיר →</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   § CALENDAR SCREEN
   ══════════════════════════════════════════════════════════════ */
function CalendarScreen({ isVerified, isRegistered, onGoProfile, items, onAddItem, onToggleReminder }) {
  const [gateMsg,   setGateMsg]   = useState(null);
  const [schedOpen, setSchedOpen] = useState(false);
  const [newTitle,  setNewTitle]  = useState('');
  const [newDate,   setNewDate]   = useState('');
  const [newTime,   setNewTime]   = useState('');
  const { showToast, ToastEl } = useToast();

  function toggleReminder(id) {
    if (!isRegistered) { setGateMsg('רוצה לקבל תזכורת לנייד? בצע רישום מהיר בפרופיל'); return; }
    const cur = items.find(l=>l.id===id);
    showToast(cur?.reminded ? '🔕 תזכורת הוסרה' : '🔔 תזכורת נוספה!');
    onToggleReminder(id);
  }
  function publish() {
    if (!newTitle.trim()) return;
    const dateParts = [newDate, newTime].filter(Boolean).join(' — ');
    onAddItem({ id:`C${Date.now()}`, title:newTitle.trim(), host:'את/ה', date:dateParts||'בקרוב', reminded:false });
    setNewTitle(''); setNewDate(''); setNewTime(''); setSchedOpen(false);
    showToast('📅 הלופ תוזמן!');
  }

  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100%'}}>
      <div className="screen-header" style={{justifyContent:'space-between'}}>
        <span style={{fontSize:'17px',fontWeight:700,color:'#fff'}}>📅 יומן לופים</span>
        {isVerified && (
          <button onClick={()=>setSchedOpen(true)} style={{
            display:'flex',alignItems:'center',gap:'6px',
            background:'linear-gradient(135deg,rgba(10,132,255,.20),rgba(0,60,220,.12))',
            border:'1px solid rgba(10,132,255,.40)',borderRadius:'999px',
            padding:'8px 16px',fontSize:'12px',fontWeight:700,color:'#fff',cursor:'pointer',
          }}>+ תזמן לופ</button>
        )}
      </div>

      <div style={{padding:'16px 20px 80px',display:'flex',flexDirection:'column',gap:'10px'}}>
        {items.map(item => (
          <div key={item.id} style={{
            background:'rgba(255,255,255,0.030)',border:'1px solid rgba(255,255,255,0.065)',
            borderRadius:'16px',padding:'14px 16px',
            display:'flex',alignItems:'center',gap:'12px',
            transition:'background .18s',
          }}>
            <div style={{
              width:'46px',height:'46px',borderRadius:'13px',flexShrink:0,
              background:'rgba(10,132,255,0.10)',border:'1px solid rgba(10,132,255,0.18)',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',
            }}>📅</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:'13px',fontWeight:600,color:'#fff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.title}</div>
              <div style={{fontSize:'11px',fontWeight:300,color:'rgba(130,160,200,0.55)',marginTop:'2px'}}>{item.host}&nbsp;·&nbsp;{item.date}</div>
            </div>
            <button onClick={()=>toggleReminder(item.id)} style={{
              width:'38px',height:'38px',borderRadius:'50%',flexShrink:0,cursor:'pointer',
              background:item.reminded?'rgba(255,204,0,0.14)':'rgba(255,255,255,0.04)',
              border:item.reminded?'1px solid rgba(255,204,0,0.36)':'1px solid rgba(255,255,255,0.08)',
              color:item.reminded?'#FFCC00':'rgba(140,165,200,0.40)',
              fontSize:'17px',display:'flex',alignItems:'center',justifyContent:'center',
              transition:'all .18s',
              boxShadow:item.reminded?'0 0 10px rgba(255,204,0,0.20)':'none',
            }}>🔔</button>
          </div>
        ))}
      </div>
      {/* ── Schedule form modal ── */}
      {schedOpen && (
        <div style={{position:'fixed',inset:0,display:'flex',alignItems:'flex-end',justifyContent:'center',background:'rgba(0,0,0,0.68)',zIndex:850,animation:'fade-in .2s ease'}}>
          <div style={{background:'rgba(8,13,28,0.99)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:'22px 22px 0 0',padding:'22px 20px 32px',width:'100%',maxWidth:'430px',animation:'slide-up .26s ease',display:'flex',flexDirection:'column',gap:'12px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'2px'}}>
              <span style={{fontSize:'15px',fontWeight:700,color:'#fff'}}>📅 תזמן לופ חדש</span>
              <button onClick={()=>setSchedOpen(false)} style={{width:'28px',height:'28px',borderRadius:'50%',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.10)',color:'rgba(160,180,220,0.55)',cursor:'pointer',fontSize:'12px'}}>✕</button>
            </div>
            {[
              { label:'נושא הלופ', el:<input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="על מה תדבר?" onKeyDown={e=>e.key==='Enter'&&publish()}/> },
              { label:'תאריך',     el:<input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)}/> },
              { label:'שעה',       el:<input type="time" value={newTime} onChange={e=>setNewTime(e.target.value)}/> },
            ].map(({label,el})=>(
              <div key={label}>
                <div style={{fontSize:'10px',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'rgba(90,130,185,0.55)',marginBottom:'5px'}}>{label}</div>
                {React.cloneElement(el,{style:{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.10)',borderRadius:'12px',padding:'11px 14px',fontSize:'14px',color:'#fff',outline:'none',fontFamily:'var(--font)',colorScheme:'dark'}})}
              </div>
            ))}
            <button onClick={publish} disabled={!newTitle.trim()} style={{marginTop:'4px',padding:'13px',borderRadius:'14px',cursor:newTitle.trim()?'pointer':'default',background:'linear-gradient(135deg,rgba(10,132,255,.28),rgba(0,60,220,.18))',border:'1px solid rgba(10,132,255,.42)',fontSize:'14px',fontWeight:700,color:'#fff',opacity:newTitle.trim()?1:0.45,transition:'opacity .15s'}}>
              פרסם לופ
            </button>
          </div>
        </div>
      )}

      {gateMsg && <GateModal msg={gateMsg} onClose={()=>setGateMsg(null)} onGoProfile={()=>{setGateMsg(null);onGoProfile();}}/>}
      {ToastEl}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   § PROFILE SCREEN
   ══════════════════════════════════════════════════════════════ */
function ProfileScreen({ profile, onSave, hostRequests, onRequestHost, onApproveHost, onRejectHost, isRegistered }) {
  const [name,      setName]      = useState(profile.name  || '');
  const [phone,     setPhone]     = useState(profile.phone || '');
  const [email,     setEmail]     = useState(profile.email || '');
  const [topic,     setTopic]     = useState('');
  const [when,      setWhen]      = useState('');
  const vStatus = profile.verifyStatus || 'none';   // derived — never local state
  const [saving,    setSaving]    = useState(false);
  const [adminOpen,   setAdminOpen]   = useState(false);
  const [reqOpen,     setReqOpen]     = useState(false);
  const [inviteCode,  setInviteCode]  = useState('');
  const { showToast, ToastEl } = useToast();
  const imgInputRef = useRef(null);
  const IS_ADMIN = name.trim() === 'יעקב שפירא';
  const isDirty = name !== (profile.name||'') || phone !== (profile.phone||'') || email !== (profile.email||'');

  function handleCodeSubmit() {
    if (inviteCode.trim() !== 'MICLOOP2026') { showToast('❌ קוד שגוי'); return; }
    setVStatus('verified');
    onSave({ ...profile, name, phone, email, verifyStatus:'verified' });
    showToast('🎙 אושרת כמארח!');
  }

  function pickImage(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    onSave({ ...profile, name, phone, email, verifyStatus: vStatus, avatarUrl: url });
    e.target.value = '';
  }

  function handleSave() {
    setSaving(true);
    setTimeout(() => {
      onSave({ ...profile, name, phone, email, verifyStatus: vStatus });
      setSaving(false);
      showToast('הפרופיל עודכן בהצלחה! ✨');
    }, 1000);
  }

  function handleRequest() {
    if (!topic.trim()) return;
    onRequestHost({ id:Date.now(), name, phone, topic, when, status:'pending' });
    setVStatus('pending');
    onSave({ ...profile, name, phone, email, verifyStatus:'pending' });
    showToast('📨 הבקשה נשלחה למנהל!');
  }

  const inputStyle = {
    width:'100%',background:'rgba(255,255,255,0.04)',
    border:'1px solid rgba(255,255,255,0.10)',borderRadius:'12px',
    padding:'12px 14px',fontSize:'14px',fontWeight:400,
    color:'#fff',outline:'none',fontFamily:'var(--font)',
  };
  const label = txt => (
    <div style={{fontSize:'10px',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'rgba(90,130,185,0.55)',marginBottom:'5px'}}>{txt}</div>
  );

  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100%'}}>
      <div className="screen-header">
        <span style={{fontSize:'17px',fontWeight:700,color:'#fff',flex:1}}>פרופיל</span>
        {vStatus === 'verified' && (
          <div style={{display:'flex',alignItems:'center',gap:'5px',background:'rgba(52,199,89,0.12)',border:'1px solid rgba(52,199,89,0.28)',borderRadius:'999px',padding:'5px 12px',fontSize:'11px',fontWeight:700,color:'#34C759',flexShrink:0}}>
            ✓ מארח מאומת
          </div>
        )}
      </div>

      <div style={{padding:'20px 20px 80px',display:'flex',flexDirection:'column',gap:'20px',overflowY:'auto'}}>

        {/* Avatar */}
        <div style={{display:'flex',justifyContent:'center',paddingTop:'6px'}}>
          <div style={{position:'relative',width:'84px',height:'84px'}}>
            {/* hidden file input — opens gallery/camera on mobile */}
            <input ref={imgInputRef} type="file" accept="image/*"
              onChange={pickImage} style={{display:'none'}}/>
            <div style={{
              width:'84px',height:'84px',borderRadius:'50%',overflow:'hidden',
              background:'linear-gradient(135deg,rgba(10,132,255,.28),rgba(8,50,160,.18))',
              border:'2px solid rgba(10,132,255,.32)',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:'38px',
            }}>
              {profile.avatarUrl
                ? <img src={profile.avatarUrl} alt="avatar"
                    style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                : (profile.avatar||'🎙')
              }
            </div>
            <button onClick={()=>imgInputRef.current?.click()} style={{
              position:'absolute',bottom:0,right:0,
              width:'26px',height:'26px',borderRadius:'50%',
              background:'#0A84FF',border:'2px solid #07090F',
              cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',
            }}>✏️</button>
          </div>
        </div>

        {/* Fields */}
        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
          <div>{label('שם מלא')}<input style={inputStyle} value={name} onChange={e=>setName(e.target.value)} placeholder="הכנס שם..."/></div>
          <div>{label('טלפון')}<input style={inputStyle} value={phone} onChange={e=>setPhone(e.target.value)} placeholder="05x-xxxxxxx" type="tel"/></div>
          <div>{label('אימייל')}<input style={inputStyle} value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" type="email"/></div>
        </div>

        <button onClick={handleSave} disabled={saving || !isDirty} style={{
          width:'100%',padding:'14px',borderRadius:'14px',
          cursor:(saving||!isDirty)?'default':'pointer',
          background:'linear-gradient(135deg,rgba(10,132,255,.26),rgba(0,60,220,.18))',
          border:'1px solid rgba(10,132,255,.40)',
          fontSize:'14px',fontWeight:700,color:'#fff',transition:'all .2s',
          opacity:(saving||!isDirty)?0.40:1,
        }}>{saving?'שומר נתונים...':'שמור פרופיל'}</button>

        {/* Host section */}
        {vStatus === 'none' && (
          !isRegistered ? (
            <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'16px',padding:'16px',display:'flex',alignItems:'center',gap:'10px'}}>
              <span style={{fontSize:'20px'}}>🔒</span>
              <div style={{fontSize:'12px',fontWeight:300,color:'rgba(130,155,200,0.55)',lineHeight:1.6}}>כדי להגיש בקשת מארח, יש להשלים תחילה את הרישום בפרופיל (שם + טלפון).</div>
            </div>
          ) : (
            <div style={{background:'rgba(10,132,255,0.04)',border:'1px solid rgba(10,132,255,0.14)',borderRadius:'18px',padding:'18px',display:'flex',flexDirection:'column',gap:'12px'}}>
              <div style={{fontSize:'14px',fontWeight:700,color:'#fff'}}>🎙 הפוך למארח</div>
              <div>{label('קוד מארח סודי')}
                <div style={{display:'flex',gap:'8px'}}>
                  <input style={{...inputStyle,flex:1}} value={inviteCode} onChange={e=>setInviteCode(e.target.value)} placeholder="הכנס קוד..." onKeyDown={e=>e.key==='Enter'&&handleCodeSubmit()}/>
                  <button onClick={handleCodeSubmit} disabled={!inviteCode.trim()} style={{padding:'0 16px',borderRadius:'12px',cursor:inviteCode.trim()?'pointer':'default',background:'rgba(10,132,255,0.16)',border:'1px solid rgba(10,132,255,0.36)',fontSize:'13px',fontWeight:700,color:'#4DA8FF',opacity:inviteCode.trim()?1:0.45,flexShrink:0}}>אשר</button>
                </div>
              </div>
              <button onClick={()=>setReqOpen(true)} style={{padding:'11px',borderRadius:'12px',cursor:'pointer',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.09)',fontSize:'12px',fontWeight:500,color:'rgba(150,175,220,0.60)'}}>
                אין לך קוד? הגש בקשה כאן →
              </button>
            </div>
          )
        )}
        {vStatus === 'pending' && (
          <div style={{background:'rgba(255,204,0,0.06)',border:'1px solid rgba(255,204,0,0.20)',borderRadius:'16px',padding:'16px',display:'flex',alignItems:'center',gap:'10px'}}>
            <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#FFCC00',animation:'blink 1s ease-in-out infinite',flexShrink:0}}/>
            <div>
              <div style={{fontSize:'13px',fontWeight:600,color:'rgba(255,204,0,0.85)'}}>הבקשה בטיפול</div>
              <div style={{fontSize:'11px',fontWeight:300,color:'rgba(200,180,80,0.55)',marginTop:'2px'}}>המנהל יאשר בקרוב</div>
            </div>
          </div>
        )}
        {vStatus === 'verified' && (
          <div style={{background:'rgba(52,199,89,0.06)',border:'1px solid rgba(52,199,89,0.20)',borderRadius:'18px',padding:'16px',textAlign:'center'}}>
            <div style={{fontSize:'28px',marginBottom:'6px'}}>🎙</div>
            <div style={{fontSize:'14px',fontWeight:700,color:'#34C759',marginBottom:'3px'}}>מארח מאושר!</div>
            <div style={{fontSize:'12px',fontWeight:300,color:'rgba(100,200,130,0.55)'}}>יש לך הרשאה לפתוח שידורים חיים</div>
          </div>
        )}

        {/* Admin button — secret, only for יעקב שפירא */}
        {IS_ADMIN && (
          <button onClick={()=>setAdminOpen(true)} style={{padding:'12px',borderRadius:'12px',cursor:'pointer',background:'rgba(120,60,255,0.10)',border:'1px solid rgba(120,60,255,0.28)',fontSize:'13px',fontWeight:700,color:'rgba(160,100,255,0.80)'}}>
            לוח בקרה למנהל 🛠️
          </button>
        )}
      </div>

      {/* Request modal */}
      {reqOpen && (
        <div style={{position:'fixed',inset:0,display:'flex',alignItems:'flex-end',justifyContent:'center',background:'rgba(0,0,0,0.70)',zIndex:850,animation:'fade-in .2s ease'}}>
          <div style={{background:'rgba(8,13,28,0.99)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:'22px 22px 0 0',padding:'22px 20px 32px',width:'100%',maxWidth:'430px',animation:'slide-up .26s ease',display:'flex',flexDirection:'column',gap:'12px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:'15px',fontWeight:700,color:'#fff'}}>📨 בקשת מארח</span>
              <button onClick={()=>setReqOpen(false)} style={{width:'28px',height:'28px',borderRadius:'50%',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.10)',color:'rgba(160,180,220,0.55)',cursor:'pointer',fontSize:'12px'}}>✕</button>
            </div>
            <div>{label('על מה תרצה לדבר?')}<input style={inputStyle} value={topic} onChange={e=>setTopic(e.target.value)} placeholder="נושא השידור..." autoFocus/></div>
            <div>{label('מתי ובאיזו שעה?')}<input style={inputStyle} value={when} onChange={e=>setWhen(e.target.value)} placeholder="יום ושעה מועדפים..."/></div>
            <button onClick={()=>{handleRequest(); setReqOpen(false);}} disabled={!topic.trim()} style={{padding:'13px',borderRadius:'14px',cursor:topic.trim()?'pointer':'default',background:'linear-gradient(135deg,rgba(10,132,255,.26),rgba(0,60,220,.18))',border:'1px solid rgba(10,132,255,.40)',fontSize:'14px',fontWeight:700,color:'#fff',opacity:topic.trim()?1:0.40,transition:'opacity .15s'}}>
              שלח בקשה למנהל 📨
            </button>
          </div>
        </div>
      )}

      {/* Admin panel modal */}
      {adminOpen && (
        <div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.76)',zIndex:900,animation:'fade-in .2s ease'}}>
          <div style={{background:'rgba(8,12,26,0.99)',border:'1px solid rgba(255,255,255,0.10)',borderRadius:'22px',padding:'22px 20px 20px',width:'90%',maxWidth:'380px',maxHeight:'78vh',display:'flex',flexDirection:'column',animation:'slide-up .25s ease'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px',flexShrink:0}}>
              <span style={{fontSize:'15px',fontWeight:700,color:'#fff'}}>🛠️ בקשות מארחים ({hostRequests.length})</span>
              <button onClick={()=>setAdminOpen(false)} style={{width:'28px',height:'28px',borderRadius:'50%',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.10)',color:'rgba(160,180,220,0.55)',cursor:'pointer',fontSize:'12px'}}>✕</button>
            </div>
            <div style={{overflowY:'auto',flex:1}}>
              {hostRequests.length === 0 ? (
                <div style={{textAlign:'center',padding:'32px 0',color:'rgba(140,165,200,0.35)',fontSize:'13px'}}>אין בקשות ממתינות</div>
              ) : hostRequests.map(req => (
                <div key={req.id} style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'14px',padding:'14px',marginBottom:'10px'}}>
                  <div style={{fontSize:'13px',fontWeight:600,color:'#fff',marginBottom:'2px'}}>{req.name}</div>
                  <div style={{fontSize:'11px',color:'rgba(130,155,200,0.55)',marginBottom:'5px'}}>{req.phone}{req.when ? ` · ${req.when}` : ''}</div>
                  <div style={{fontSize:'12px',color:'rgba(180,200,230,0.70)',marginBottom:'10px',fontStyle:'italic'}}>"{req.topic}"</div>
                  {req.status === 'pending' ? (
                    <div style={{display:'flex',gap:'8px'}}>
                      <button onClick={()=>{onApproveHost(req.id); showToast(`✅ ${req.name} אושר כמארח`);}} style={{flex:2,padding:'9px',borderRadius:'10px',cursor:'pointer',background:'rgba(52,199,89,0.14)',border:'1px solid rgba(52,199,89,0.30)',fontSize:'12px',fontWeight:700,color:'#34C759'}}>אשר ✓</button>
                      <button onClick={()=>{onRejectHost(req.id); showToast('❌ הבקשה נדחתה');}} style={{flex:1,padding:'9px',borderRadius:'10px',cursor:'pointer',background:'rgba(255,59,48,0.10)',border:'1px solid rgba(255,59,48,0.24)',fontSize:'12px',fontWeight:600,color:'#FF3B30'}}>דחה</button>
                    </div>
                  ) : (
                    <div style={{fontSize:'11px',fontWeight:700,color:req.status==='approved'?'#34C759':'#FF3B30',textAlign:'center',padding:'4px 0'}}>
                      {req.status === 'approved' ? '✓ אושר' : '✕ נדחה'}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {ToastEl}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   § APP ROOT
   ══════════════════════════════════════════════════════════════ */
function App() {
  const [screen,    setScreen]    = useState('home');
  const [tab,       setTab]       = useState('feed');
  const [liveMode,  setLiveMode]  = useState('host');
  const [liveLoop,  setLiveLoop]  = useState(null);
  const [liveLoops, setLiveLoops] = useState([]);
  const [pastLoops, setPastLoops] = useState(PAST);
  const [likedIds,  setLikedIds]  = useState(new Set());
  const [ratings,   setRatings]   = useState({
    P1:{ avg:4.7, count:312, mine:0 },
    P2:{ avg:4.5, count:205, mine:0 },
    P3:{ avg:4.8, count:180, mine:0 },
  });

  function handleLike(id) {
    setLikedIds(prev => { const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });
  }
  function handleRate(loopId, stars) {
    setRatings(prev => {
      const cur = prev[loopId] || { avg:0, count:0, mine:0 };
      const newCount = cur.mine>0 ? cur.count : cur.count+1;
      const newAvg   = cur.mine>0
        ? (cur.avg*cur.count - cur.mine + stars) / cur.count
        : (cur.avg*cur.count + stars) / newCount;
      return { ...prev, [loopId]:{ avg:newAvg, count:newCount, mine:stars } };
    });
  }

  const [calItems,  setCalItems]  = useState([
    { id:'C1', title:'AI ומוזיקה בעידן החדש',      host:'נועם ברק',  date:'שישי, 1.6 — 20:00',  reminded:false },
    { id:'C2', title:'פודקאסט יזמות נשית',          host:'רוני שפיר', date:'רביעי, 5.6 — 19:00', reminded:false },
    { id:'C3', title:'כלים ליצירתיות יומיומית',     host:'תמר כץ',   date:'שבת, 7.6 — 21:30',   reminded:false },
    { id:'C4', title:'מוזיקה קלאסית vs אלקטרונית', host:'עדן לוי',   date:'שני, 9.6 — 18:00',   reminded:false },
  ]);
  const [hostRequests, setHostRequests] = useState([]);
  const onRequestHost = req  => setHostRequests(prev => [...prev, req]);
  const onApproveHost = id   => { setHostRequests(prev => prev.map(r => r.id===id ? {...r,status:'approved'} : r)); setProfile(prev => ({...prev, verifyStatus:'verified'})); };
  const onRejectHost  = id   => { setHostRequests(prev => prev.map(r => r.id===id ? {...r,status:'rejected'} : r)); setProfile(prev => ({...prev, verifyStatus:'none'})); };

  const handleAddCalItem     = item => setCalItems(prev => [item, ...prev]);
  const handleToggleReminder = id   => setCalItems(prev => prev.map(l => l.id===id ? {...l, reminded:!l.reminded} : l));

  const [profile,   setProfile]   = useState({
    name:'', phone:'', email:'',
    avatar:'🎙', verifyStatus: localStorage.getItem('ml_host') || 'none',
  });
  const { showToast, ToastEl } = useToast();

  const isVerified   = profile.verifyStatus === 'verified';
  const isRegistered = !!(profile.name?.trim() && profile.phone?.trim());

  const [showTitleForm, setShowTitleForm] = useState(false);
  const [loopTitle,     setLoopTitle]     = useState('');

  function startHostLive() {
    const title = loopTitle.trim() || (profile.name ? `הלופ של ${profile.name}` : 'הלופ שלי');
    setLoopTitle(''); setShowTitleForm(false);
    goLive('host', null, title);
  }

  function goLive(mode, loop, title) {
    const activeLoop = loop || {
      id: `live-${Date.now()}`,
      title: title || (profile.name ? `הלופ של ${profile.name}` : 'הלופ שלי'),
      host: { name: profile.name || 'את/ה', avatar: profile.avatar, avatarUrl: profile.avatarUrl || null },
      speakers: [], listeners: 0,
    };
    setLiveMode(mode); setLiveLoop(activeLoop);
    if (mode === 'host') setLiveLoops(prev => [activeLoop, ...prev]);
    setScreen('live');
  }

  function handleHostEnd(newLoop) {
    setLiveLoops(prev => prev.filter(l => l.id !== liveLoop?.id));
    if (newLoop) { setPastLoops(prev => [newLoop, ...prev]); showToast('✅ הלופ נשמר בארכיון!'); }
    setScreen('home');
  }

  function handleSaveProfile(updated) {
    setProfile(updated);
    if (updated.verifyStatus === 'verified') localStorage.setItem('ml_host','verified');
    else if (updated.verifyStatus === 'none') localStorage.removeItem('ml_host');
  }

  /* Tab bar */
  const likedLoops = [...pastLoops, ...PAST.filter(p=>!pastLoops.find(l=>l.id===p.id))]
    .filter(l=>likedIds.has(l.id));

  const tabs = [
    { id:'feed',     icon:'🏠', label:'פיד' },
    { id:'library',  icon:'❤️', label:'ספרייה' },
    { id:'calendar', icon:'📅', label:'יומן' },
    { id:'profile',  icon:'👤', label:'פרופיל' },
  ];

  if (screen === 'live') {
    return (
      <>
        <LiveRoomScreen
          mode={liveMode}
          loop={liveLoop}
          onEnd={handleHostEnd}
          onLeave={() => setScreen('home')}
          isRegistered={isRegistered}
          onGoProfile={() => { setScreen('home'); setTab('profile'); }}
        />
        {ToastEl}
      </>
    );
  }

  return (
    <>
      <div style={{height:'100%',maxWidth:'430px',margin:'0 auto',display:'flex',flexDirection:'column',position:'relative'}}>
        <div className="shell">
          {tab === 'feed' && (
            <HomeScreen
              liveLoops={liveLoops} pastLoops={pastLoops}
              onGoLive={() => setShowTitleForm(true)}
              onJoin={loop => goLive('listener', loop)}
              isVerified={isVerified} onGoProfile={() => setTab('profile')}
              likedIds={likedIds} onLike={handleLike}
              ratings={ratings} onRate={handleRate}
              isRegistered={isRegistered}
            />
          )}
          {tab === 'library' && (
            <LibraryScreen
              likedLoops={likedLoops} likedIds={likedIds} onLike={handleLike}
              ratings={ratings} onRate={handleRate}
            />
          )}
          {tab === 'calendar' && (
            <CalendarScreen
              isVerified={isVerified} isRegistered={isRegistered} onGoProfile={()=>setTab('profile')}
              items={calItems} onAddItem={handleAddCalItem} onToggleReminder={handleToggleReminder}
            />
          )}
          {tab === 'profile' && (
            <ProfileScreen profile={profile} onSave={handleSaveProfile}
              hostRequests={hostRequests} onRequestHost={onRequestHost}
              onApproveHost={onApproveHost} onRejectHost={onRejectHost}
              isRegistered={isRegistered}
            />
          )}
        </div>

        {/* Tab bar */}
        <div className="tab-bar">
          {tabs.map(t => (
            <button key={t.id}
              className={`tab-item${tab===t.id?' active':''}`}
              onClick={() => setTab(t.id)}
            >
              <span className="tab-icon">{t.icon}</span>
              {t.label}
            </button>
          ))}
        </div>
      </div>
      {/* ── Loop title form ── */}
      {showTitleForm && (
        <div style={{position:'fixed',inset:0,display:'flex',alignItems:'flex-end',justifyContent:'center',background:'rgba(0,0,0,0.70)',zIndex:850,animation:'fade-in .2s ease'}}>
          <div style={{background:'rgba(8,13,28,0.99)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:'22px 22px 0 0',padding:'22px 20px 36px',width:'100%',maxWidth:'430px',animation:'slide-up .26s ease',display:'flex',flexDirection:'column',gap:'14px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:'15px',fontWeight:700,color:'#fff'}}>🎙 על מה תשדר היום?</span>
              <button onClick={()=>{setShowTitleForm(false);setLoopTitle('');}} style={{width:'28px',height:'28px',borderRadius:'50%',background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.10)',color:'rgba(160,180,220,0.55)',cursor:'pointer',fontSize:'12px'}}>✕</button>
            </div>
            <input
              autoFocus
              value={loopTitle}
              onChange={e=>setLoopTitle(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&loopTitle.trim()&&startHostLive()}
              placeholder="נושא הלופ..."
              style={{width:'100%',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(10,132,255,0.30)',borderRadius:'14px',padding:'14px 16px',fontSize:'15px',color:'#fff',outline:'none',fontFamily:'var(--font)'}}
            />
            <button onClick={startHostLive} disabled={!loopTitle.trim()} style={{padding:'14px',borderRadius:'14px',cursor:loopTitle.trim()?'pointer':'default',background:'linear-gradient(135deg,rgba(255,59,48,.26),rgba(200,30,20,.18))',border:'1px solid rgba(255,59,48,.42)',fontSize:'14px',fontWeight:700,color:'#fff',opacity:loopTitle.trim()?1:0.40,transition:'opacity .15s'}}>
              🔴 התחל שידור חי
            </button>
          </div>
        </div>
      )}

      {ToastEl}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AudioProvider><App/></AudioProvider>
);
</script>
</body>
</html>
