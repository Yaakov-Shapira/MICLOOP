<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>MicLoop</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>

  <style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

  :root {
    --accent:        #0A84FF;
    --accent-dim:    rgba(10,132,255,0.13);
    --accent-border: rgba(10,132,255,0.28);
    --glass:         rgba(8,12,24,0.68);
    --border:        rgba(255,255,255,0.07);
    --text:          #fff;
    --text-dim:      rgba(128,148,184,0.75);
    --red:           #FF3B30;
    --green:         #30D158;
    --font:          'Heebo', -apple-system, sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    background: radial-gradient(ellipse 120% 60% at 50% 0%, #000B18 0%, #000 68%);
  }

  #root {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
  }

  .shell {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .shell::-webkit-scrollbar { display: none; }

  .glass-card {
    background: var(--glass);
    backdrop-filter: blur(32px) saturate(160%);
    -webkit-backdrop-filter: blur(32px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 20px;
  }

  .screen-header {
    display: flex;
    align-items: center;
    padding: 18px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.045);
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(0,0,0,0.90);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    gap: 12px;
  }

  .progress-track { cursor: pointer; border-radius: 999px; overflow: hidden; }
  .progress-track:hover .progress-fill { filter: brightness(1.25); }

  .wb {
    width: 3px; border-radius: 2px;
    background: var(--accent);
    transform-origin: center;
    animation: wave-bar 1.3s ease-in-out infinite;
  }
  .wb:nth-child(1) { height:10px; animation-delay:0s;   }
  .wb:nth-child(2) { height:16px; animation-delay:.18s; }
  .wb:nth-child(3) { height:12px; animation-delay:.36s; }
  .wb:nth-child(4) { height:18px; animation-delay:.54s; }
  .wb:nth-child(5) { height:10px; animation-delay:.72s; }

  @keyframes glow-blue {
    0%,100% { box-shadow: 0 0 36px rgba(10,132,255,.35), 0 0 80px rgba(10,132,255,.12); }
    50%      { box-shadow: 0 0 56px rgba(10,132,255,.65), 0 0 120px rgba(10,132,255,.25); }
  }
  @keyframes glow-red {
    0%,100% { box-shadow: 0 0 36px rgba(255,59,48,.35), 0 0 80px rgba(255,59,48,.12); }
    50%      { box-shadow: 0 0 56px rgba(255,59,48,.65), 0 0 120px rgba(255,59,48,.25); }
  }
  @keyframes blink     { 0%,100%{opacity:1} 50%{opacity:.12} }
  @keyframes wave-bar  { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.22)} }
  @keyframes ring-expand {
    0%   { transform: scale(.82); opacity: .85; }
    100% { transform: scale(1.20); opacity: 0;  }
  }
  @keyframes slide-up  { from{transform:translateY(22px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes fade-in   { from{opacity:0} to{opacity:1} }
  @keyframes pulse-dot {
    0%,100% { opacity:1; transform:scale(1); }
    50%     { opacity:.45; transform:scale(.82); }
  }
  @keyframes emoji-float {
    0%   { transform:translateY(0) scale(1);    opacity:1; }
    80%  { opacity:1; }
    100% { transform:translateY(-130px) scale(1.5); opacity:0; }
  }

  .glow-blue { animation: glow-blue 2.4s ease-in-out infinite; }
  .glow-red  { animation: glow-red  1.6s ease-in-out infinite; }

  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0   rgba(255,59,48,.70); }
    70%  { box-shadow: 0 0 0 8px rgba(255,59,48,.00); }
    100% { box-shadow: 0 0 0 0   rgba(255,59,48,.00); }
  }
  .live-dot {
    width:8px; height:8px; border-radius:50%;
    background:#FF3B30;
    animation: live-pulse 1.8s ease-out infinite;
    flex-shrink:0;
  }

  .past-row {
    display:flex; align-items:center; gap:13px;
    padding:14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.045);
  }
  .past-row:last-child { border-bottom:none; }

  .vol-slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 3px; border-radius: 999px;
    background: rgba(255,255,255,0.10); outline: none; cursor: pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #0A84FF; box-shadow: 0 0 8px rgba(10,132,255,0.65);
    cursor: pointer; transition: transform .15s;
  }
  .vol-slider::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .vol-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #0A84FF; box-shadow: 0 0 8px rgba(10,132,255,0.65);
    border: none; cursor: pointer;
  }

  /* ── Tab bar ── */
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    display: flex; align-items: stretch;
    background: rgba(5,8,18,0.97);
    border-top: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    z-index: 200;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 9px 0 7px; cursor: pointer;
    border: none; background: transparent;
    color: rgba(100,130,180,0.40);
    font-family: var(--font); font-size: 9px; font-weight: 600;
    letter-spacing: .8px; text-transform: uppercase; gap: 3px;
    transition: color .18s; -webkit-tap-highlight-color: transparent;
  }
  .tab-item.active { color: #0A84FF; }
  .tab-item .tab-icon { font-size: 21px; }

  /* ── Emoji float ── */
  .emoji-float {
    position: absolute; pointer-events: none; z-index: 700;
    font-size: 30px; animation: emoji-float .95s ease-out forwards;
  }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ══════════════════════════════════════════════════════════════
   § IndexedDB
   ══════════════════════════════════════════════════════════════ */
const _DB = 'micloop-db';
const _ST = 'recordings';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(_DB, 1);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(_ST, { keyPath:'id', autoIncrement:true })
        .createIndex('createdAt','createdAt',{unique:false});
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}
async function dbSave({ blob, name, duration }) {
  const db = await openDB();
  return new Promise((res,rej) => {
    const req = db.transaction(_ST,'readwrite').objectStore(_ST)
      .add({ blob, name, duration, createdAt: Date.now() });
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
async function dbGetAll() {
  const db = await openDB();
  return new Promise((res,rej) => {
    const req = db.transaction(_ST,'readonly').objectStore(_ST).getAll();
    req.onsuccess = () => res([...req.result].reverse());
    req.onerror   = () => rej(req.error);
  });
}

/* ══════════════════════════════════════════════════════════════
   § Mock data
   ══════════════════════════════════════════════════════════════ */
const LIVE = [];
const PAST = [
  { id:'P1', title:'למה רוב הפודקאסטים נכשלים',  host:{ name:'נועם ברק',  avatar:'🎙' }, dur:487, listeners:312 },
  { id:'P2', title:'מוסיקה, AI וזכויות יוצרים',   host:{ name:'תמר כץ',    avatar:'🎵' }, dur:362, listeners:205 },
  { id:'P3', title:'יזמות נשית — איפה הפערים?',   host:{ name:'רוני שפיר', avatar:'👩‍🚀'}, dur:521, listeners:180 },
];

/* ══════════════════════════════════════════════════════════════
   § Utilities
   ══════════════════════════════════════════════════════════════ */
const pad2 = n => String(n).padStart(2,'0');
const fmt  = s => `${pad2(Math.floor(s/60))}:${pad2(Math.floor(s%60))}`;

/* ══════════════════════════════════════════════════════════════
   § Toast hook
   ══════════════════════════════════════════════════════════════ */
function useToast() {
  const [msg, setMsg] = useState(null);
  const t = useRef(null);
  function showToast(m) {
    setMsg(m); clearTimeout(t.current);
    t.current = setTimeout(() => setMsg(null), 3200);
  }
  const ToastEl = msg
    ? <div style={{
        position:'fixed', bottom:'80px', left:'50%',
        transform:'translateX(-50%)',
        background:'rgba(12,18,36,0.97)',
        border:'1px solid rgba(255,255,255,0.09)',
        backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)',
        color:'#fff', fontSize:'14px', fontWeight:500,
        padding:'11px 22px', borderRadius:'999px',
        whiteSpace:'nowrap', zIndex:9000,
        pointerEvents:'none',
        boxShadow:'0 8px 36px rgba(0,0,0,0.65)',
        animation:'slide-up .28s ease',
      }}>{msg}</div>
    : null;
  return { showToast, ToastEl };
}

/* ══════════════════════════════════════════════════════════════
   § Waveform logo
   ══════════════════════════════════════════════════════════════ */
function WaveformLogo() {
  const bars = [10, 18, 26, 32, 26, 18, 10];
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'10px' }}>
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        {bars.map((h, i) => (
          <rect key={i} x={i*5} y={(36-h)/2} width="3" height={h} rx="1.5"
            fill="#47A1FF"
            opacity={0.55 + i*0.04 - Math.abs(i-3)*0.06}
            style={{ animation:`wave-bar ${1.1+i*0.08}s ease-in-out infinite`, animationDelay:`${i*0.10}s`, transformOrigin:'center' }}
          />
        ))}
      </svg>
      <span style={{ fontSize:'18px', fontWeight:700, letterSpacing:'3.5px', textTransform:'uppercase', color:'#fff', fontFamily:'var(--font)' }}>
        Micloop
      </span>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   § Past loop card — inline player + heart + stars
   ══════════════════════════════════════════════════════════════ */
function PastLoopCard({ loop, playing, onPlay, liked, onLike, ratingData, onRate }) {
  const hasAudio = !!loop.blobUrl;
  const [cur, setCur] = useState(0);
  const [dragPos, setDragPos] = useState(null);
  const [hoverStar, setHoverStar] = useState(0);
  const audioRef = useRef(null);
  const tot = loop.dur || 0;
  const displayCur = dragPos !== null ? dragPos : cur;
  const pct = tot > 0 ? (displayCur / tot) * 100 : 0;
  const rd = ratingData || { avg:0, count:0, mine:0 };

  useEffect(() => {
    const el = audioRef.current; if (!el || !hasAudio) return;
    if (playing) el.play().catch(()=>{}); else el.pause();
  }, [playing]);

  useEffect(() => {
    const el = audioRef.current; if (!el) return;
    const onT = () => setCur(el.currentTime);
    const onE = () => { setCur(0); if (playing) onPlay(); };
    el.addEventListener('timeupdate', onT);
    el.addEventListener('ended', onE);
    return () => { el.removeEventListener('timeupdate',onT); el.removeEventListener('ended',onE); };
  }, [playing]);

  function handleShare() {
    const url  = `https://micloop.com/loop/${loop.id}`;
    const text = `שמעת כבר את הלופ הזה ב-Micloop? 🎙️\n🎬 ${loop.title} מאת ${loop.host.name}\n\nלהאזנה בלחיצה: ${url}`;
    if (navigator.share) navigator.share({ title: loop.title, text, url }).catch(()=>{});
    else navigator.clipboard?.writeText(text).then(()=>alert('הקישור הועתק ✓'));
  }

  const activeStar = hoverStar || rd.mine;

  return (
    <div style={{
      padding:'12px 14px',
      background: playing ? 'rgba(10,132,255,0.06)' : 'rgba(255,255,255,0.028)',
      borderRadius:'16px',
      border: playing ? '1px solid rgba(10,132,255,0.22)' : '1px solid rgba(255,255,255,0.055)',
      marginBottom:'9px', transition:'all .2s',
    }}>
      {hasAudio && <audio ref={audioRef} src={loop.blobUrl} preload="auto" style={{display:'none'}}/>}

      {/* Row 1: avatar · info+progress · play */}
      <div style={{display:'flex',alignItems:'center',gap:'11px'}}>
        <div style={{
          width:'40px',height:'40px',borderRadius:'50%',flexShrink:0,overflow:'hidden',
          background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',
          display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',lineHeight:1,
        }}>
          {loop.host.avatarUrl
            ? <img src={loop.host.avatarUrl} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            : loop.host.avatar}
        </div>

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:'13px',fontWeight:600,color:'#fff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:'2px'}}>{loop.title}</div>
          <div style={{fontSize:'10.5px',fontWeight:300,color:'rgba(140,165,200,0.60)',marginBottom:hasAudio?'6px':0}}>
            {loop.host.name}&nbsp;·&nbsp;⏱ {fmt(tot)}&nbsp;·&nbsp;🎧 {(loop.listeners||0).toLocaleString()}
          </div>
          {hasAudio && (
            <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
              <span style={{fontSize:'9.5px',fontVariantNumeric:'tabular-nums',color:'rgba(100,130,180,0.55)',flexShrink:0}}>{fmt(displayCur)}</span>
              <input type="range" dir="ltr" className="vol-slider"
                min={0} max={tot||1} step={0.1} value={displayCur}
                onChange={e=>setDragPos(Number(e.target.value))}
                onMouseUp={e=>{if(audioRef.current)audioRef.current.currentTime=Number(e.target.value);setDragPos(null);}}
                onTouchEnd={e=>{if(audioRef.current)audioRef.current.currentTime=Number(e.currentTarget.value);setDragPos(null);}}
                style={{flex:1,background:`linear-gradient(to right,#0A84FF ${pct}%,rgba(255,255,255,0.09) ${pct}%)`}}
              />
              <span style={{fontSize:'9.5px',fontVariantNumeric:'tabular-nums',color:'rgba(100,130,180,0.55)',flexShrink:0}}>{fmt(tot)}</span>
            </div>
          )}
        </div>

        <button onClick={onPlay} disabled={!hasAudio} style={{
          width:'36px',height:'36px',borderRadius:'50%',flexShrink:0,
          background:playing?'rgba(10,132,255,0.20)':'rgba(255,255,255,0.06)',
          border:playing?'1px solid rgba(10,132,255,0.42)':'1px solid rgba(255,255,255,0.10)',
          color:hasAudio?(playing?'#47A1FF':'rgba(200,215,240,0.65)'):'rgba(255,255,255,0.18)',
          fontSize:'12px',cursor:hasAudio?'pointer':'default',
          display:'flex',alignItems:'center',justifyContent:'center',
          boxShadow:playing?'0 0 14px rgba(10,132,255,0.28)':'none',transition:'all .18s',
        }}>{playing?'⏸':'▶'}</button>
      </div>

      {/* Row 2: stars · avg · heart · share */}
      <div style={{display:'flex',alignItems:'center',gap:'2px',marginTop:'9px',paddingTop:'8px',borderTop:'1px solid rgba(255,255,255,0.05)'}}>
        {[1,2,3,4,5].map(n=>(
          <button key={n}
            onClick={()=>onRate&&onRate(n)}
            onMouseEnter={()=>setHoverStar(n)}
            onMouseLeave={()=>setHoverStar(0)}
            style={{padding:'1px',background:'none',border:'none',cursor:'pointer',fontSize:'15px',lineHeight:1,
              color: n<=activeStar ? '#FFCC00' : 'rgba(255,255,255,0.15)',
              transition:'color .1s, transform .1s',
              transform: n<=activeStar ? 'scale(1.12)' : 'scale(1)',
            }}>★</button>
        ))}
        <span style={{fontSize:'10px',color:'rgba(130,155,200,0.45)',marginRight:'4px',marginLeft:'4px',fontVariantNumeric:'tabular-nums'}}>
          {rd.avg>0 ? rd.avg.toFixed(1) : '—'}&nbsp;({rd.count})
        </span>
        <div style={{flex:1}}/>
        <button onClick={onLike} style={{
          width:'30px',height:'30px',borderRadius:'50%',
          background:liked?'rgba(255,59,48,0.12)':'rgba(255,255,255,0.03)',
          border:liked?'1px solid rgba(255,59,48,0.30)':'1px solid rgba(255,255,255,0.07)',
          fontSize:'14px',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',
          transition:'all .18s',
          boxShadow:liked?'0 0 10px rgba(255,59,48,0.22)':'none',
        }}>{liked?'❤️':'🤍'}</button>
        <button onClick={handleShare} style={{
          width:'30px',height:'30px',borderRadius:'50%',marginRight:'4px',
          background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.07)',
          color:'rgba(100,130,175,0.45)',fontSize:'12px',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',transition:'all .18s',
        }}>🔗</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   § HOME SCREEN
   ══════════════════════════════════════════════════════════════ */
function HomeScreen({ liveLoops, pastLoops, onGoLive, onJoin, isVerified, onGoProfile,
                      likedIds, onLike, ratings, onRate, isRegistered }) {
  const [playingId, setPlayingId] = useState(null);
  const [dbLoops,   setDbLoops]   = useState([]);
  const [gateMsg,   setGateMsg]   = useState(null);

  useEffect(() => {
    let alive = true;
    dbGetAll().then(list => {
      if (!alive) return;
      setDbLoops(list.map(r => ({
        id: `db-${r.id}`, title: r.name,
        host: r.host || { name:'את/ה', avatar:'🎙' },
        dur: r.duration, listeners: 0,
        blobUrl: URL.createObjectURL(r.blob),
      })));
    }).catch(()=>{});
    return () => { alive = false; };
  }, []);

  const allPast    = [...dbLoops, ...pastLoops];
  const togglePlay = id => setPlayingId(p => p === id ? null : id);

  function handleLike(id) {
    if (!isRegistered) { setGateMsg('רוצה לשמור לופים בספרייה האישית? בצע רישום מהיר בפרופיל'); return; }
    onLike(id);
  }

  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100%'}}>
      <div className="screen-header" style={{justifyContent:'space-between',gap:'12px'}}>
        <WaveformLogo/>
        {isVerified ? (
          <button onClick={onGoLive} style={{
            display:'flex',alignItems:'center',gap:'7px',
            background:'linear-gradient(135deg,rgba(10,132,255,.22),rgba(0,60,220,.14))',
            border:'1px solid rgba(10,132,255,.44)',borderRadius:'999px',
            padding:'9px 20px',fontSize:'13px',fontWeight:700,color:'#fff',
            cursor:'pointer',whiteSpace:'nowrap',flexShrink:0,
            boxShadow:'0 4px 18px rgba(10,132,255,.20)',transition:'all .2s',
          }}
            onMouseEnter={e=>e.currentTarget.style.boxShadow='0 4px 24px rgba(10,132,255,.40)'}
            onMouseLeave={e=>e.currentTarget.style.boxShadow='0 4px 18px rgba(10,132,255,.20)'}
          >🎙 פתח לופ חדש</button>
        ) : (
          <button onClick={onGoProfile} style={{
            display:'flex',alignItems:'center',gap:'6px',
            background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.12)',
            borderRadius:'999px',padding:'8px 16px',fontSize:'12px',fontWeight:600,
            color:'rgba(160,185,220,0.65)',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0,
          }}>🎙 הפוך למארח</button>
        )}
      </div>

      <div style={{padding:'6px 20px 80px',display:'flex',flexDirection:'column',gap:'26px'}}>

        {/* Live section */}
        {liveLoops.length > 0 && (
          <div>
            <div style={{
              display:'flex',alignItems:'center',gap:'8px',marginBottom:'13px',
              fontSize:'10px',fontWeight:700,letterSpacing:'3.5px',textTransform:'uppercase',color:'#FF3B30',
            }}>
              <span className="live-dot"/>
              חם עכשיו
              <span style={{
                background:'rgba(255,59,48,.10)',border:'1px solid rgba(255,59,48,.24)',
                borderRadius:'999px',padding:'2px 10px',
                fontSize:'10px',fontWeight:500,color:'rgba(255,100,90,.72)',marginRight:'4px',
              }}>{liveLoops[0].listeners.toLocaleString()} מאזינים</span>
            </div>

            {liveLoops.map(loop => (
              <div key={loop.id} style={{
                display:'flex',borderRadius:'18px',
                background:'rgba(255,59,48,0.04)',border:'1px solid rgba(255,59,48,0.20)',
                overflow:'hidden',marginBottom:'10px',
              }}>
                <div style={{width:'3px',background:'#FF3B30',flexShrink:0}}/>
                <div style={{flex:1,padding:'15px'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'13px'}}>
                    <div style={{
                      width:'48px',height:'48px',borderRadius:'50%',flexShrink:0,
                      background:'rgba(255,59,48,0.12)',border:'1px solid rgba(255,59,48,0.28)',

/* ══════════════════════════════════════════════════════════════
   § AUDIO PROVIDER
   ══════════════════════════════════════════════════════════════ */
const BG_MUSIC_SRC = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
const MusicCtx = React.createContext(null);
const useAudioManager = () => React.useContext(MusicCtx);

function AudioProvider({ children }) {
  const [bgPlaying,   setBgPlaying]   = useState(false);
  const [bgPaused,    setBgPaused]    = useState(false);
  const [bgVolume,    setBgVolume]    = useState(0.40);
  const [bgTrackName, setBgTrackName] = useState('ברירת מחדל');

  const bgRef        = useRef(null);
  const fileInputRef = useRef(null);
  const audioCtxRef  = useRef(null);
  const gainNodeRef  = useRef(null);
  const srcNodeRef   = useRef(null);
  const targetVol    = useRef(0.40);

  useEffect(() => { targetVol.current = bgVolume; }, [bgVolume]);
  useEffect(() => () => {
    bgRef.current?.pause();
    gainNodeRef.current?.disconnect();
    srcNodeRef.current?.disconnect();
  }, []);

  async function ensureAudioCtx() {
    if (!audioCtxRef.current) {
      const ctx  = new (window.AudioContext || window.webkitAudioContext)();
      const gain = ctx.createGain();
      gain.gain.value = targetVol.current;
      gain.connect(ctx.destination);
      audioCtxRef.current = ctx;
      gainNodeRef.current = gain;
      if (bgRef.current && !srcNodeRef.current) {
        srcNodeRef.current = ctx.createMediaElementSource(bgRef.current);
        srcNodeRef.current.connect(gain);
      }
    }
    if (audioCtxRef.current.state === 'suspended')
      await audioCtxRef.current.resume();
  }

  async function playBg() {
    await ensureAudioCtx();
    const now = audioCtxRef.current.currentTime;
    gainNodeRef.current?.gain.setValueAtTime(targetVol.current, now);
    await bgRef.current?.play().catch(e => console.error('[ML] play:', e));
    setBgPlaying(true); setBgPaused(false);
  }
  function pauseBg() { bgRef.current?.pause(); setBgPlaying(false); setBgPaused(true); }
  function stopBg() {
    const el = bgRef.current;
    if (el) { el.pause(); el.currentTime = 0; }
    setBgPlaying(false); setBgPaused(false);
    const gain = gainNodeRef.current, ctx = audioCtxRef.current;
    if (gain && ctx) {
      const now = ctx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(targetVol.current, now);
    }
  }
  function handleVol(e) {
    const v = Number(e.target.value);
    setBgVolume(v); targetVol.current = v;
    const gain = gainNodeRef.current, ctx = audioCtxRef.current;
    if (gain && ctx) {
      const now = ctx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(v, now + 0.08);
    } else if (bgRef.current && !gainNodeRef.current) {
      bgRef.current.volume = v;
    }
  }
  function handleUpload(e) {
    const file = e.target.files?.[0]; if (!file) return;
    const wasPlaying = bgPlaying;
    const el = bgRef.current;
    if (el) { el.pause(); el.src = URL.createObjectURL(file); el.load(); }
    setBgPlaying(false); setBgPaused(false);
    setBgTrackName(file.name.replace(/\.[^/.]+$/, ''));
    e.target.value = '';
    if (wasPlaying) setTimeout(playBg, 150);
  }

  return (
    <MusicCtx.Provider value={{
      bgPlaying, bgPaused, bgVolume, bgTrackName,
      playBg, pauseBg, stopBg, handleVol, handleUpload, ensureAudioCtx,
      bgRef, fileInputRef, audioCtxRef, gainNodeRef, targetVol,
    }}>
      <audio ref={bgRef} src={BG_MUSIC_SRC} loop preload="auto" style={{display:'none'}}/>
      <input ref={fileInputRef} type="file" accept="audio/*" onChange={handleUpload} style={{display:'none'}}/>
      {children}
    </MusicCtx.Provider>
  );
}

/* ══════════════════════════════════════════════════════════════
   § LIVE ROOM SCREEN
   ══════════════════════════════════════════════════════════════ */
function LiveRoomScreen({ mode, loop, onEnd, onLeave, isRegistered, onGoProfile }) {
  const isHost = mode === 'host';
  // anon display name used when raising hand without registration
  const anonName = useRef(`Listener #${100 + Math.floor(Math.random() * 900)}`);

  const [elapsed,  setElapsed]  = useState(0);
  const [muted,    setMuted]    = useState(false);
  const [raised,   setRaised]   = useState(false);

  /* Gate modal */
  const [gateMsg, setGateMsg] = useState(null);

  /* Chat */
  const [chatOpen,  setChatOpen]  = useState(false);
  const [messages,  setMessages]  = useState([
    { id:1, name:'תמר', text:'🔥 אחלה שידור!', time:'00:12' },
    { id:2, name:'יוסי', text:'שאלה לגבי הנושא...', time:'00:34' },
  ]);
  const [msgInput,  setMsgInput]  = useState('');
  const chatListRef = useRef(null);

  /* Reactions */
  const [floatEmojis, setFloatEmojis] = useState([]);

  /* Rating */
  const [showRating, setShowRating] = useState(false);
  const [rating,     setRating]     = useState(0);
  const exitTypeRef = useRef(null);

  const ivRef       = useRef(null);
  const t0Ref       = useRef(null);
  const mrRef       = useRef(null);
  const chunksRef   = useRef([]);
  const streamRef   = useRef(null);
  const analyserRef = useRef(null);
  const animRef     = useRef(null);
  const canvasRef   = useRef(null);
  const destRef     = useRef(null);

  const {
    bgPlaying, bgPaused, bgVolume, bgTrackName,
    playBg: _playBg, pauseBg: _pauseBg, stopBg: _stopBg,
    handleVol, handleUpload, ensureAudioCtx,
    fileInputRef, audioCtxRef, gainNodeRef, targetVol,
  } = useAudioManager();

  const [isDucked,    setIsDucked]    = useState(false);
  const [duckEnabled, setDuckEnabled] = useState(true);
  const duckFrameRef = useRef(null);
  const silTimerRef  = useRef(null);
  useEffect(() => {}, [isDucked]);

  useEffect(() => {
    if (isHost) startRec();
    return () => {
      _stopDuck();
      cancelAnimationFrame(animRef.current);
      clearInterval(ivRef.current);
      streamRef.current?.getTracks().forEach(t => t.stop());
    };
  }, []);

  /* Scroll chat to bottom on new message */
  useEffect(() => {
    if (chatListRef.current) chatListRef.current.scrollTop = chatListRef.current.scrollHeight;
  }, [messages]);

  function _stopDuck() {
    cancelAnimationFrame(duckFrameRef.current);
    clearTimeout(silTimerRef.current);
    duckFrameRef.current = null;
  }
  function startDucking() {
    if (duckFrameRef.current || !analyserRef.current) return;
    const freq = new Uint8Array(analyserRef.current.frequencyBinCount);
    const THRESH = 20, DUCK = 0.15;
    let speaking = false;
    const tick = () => {
      duckFrameRef.current = requestAnimationFrame(tick);
      analyserRef.current.getByteFrequencyData(freq);
      const talk = freq.reduce((a,b)=>a+b,0)/freq.length > THRESH;
      const gain = gainNodeRef.current, ctx = audioCtxRef.current;
      if (!gain || !ctx) return;
      const now = ctx.currentTime;
      if (talk && !speaking) {
        speaking = true; clearTimeout(silTimerRef.current);
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.linearRampToValueAtTime(targetVol.current * DUCK, now + 0.25);
        setIsDucked(true);
      } else if (!talk && speaking) {
        speaking = false; clearTimeout(silTimerRef.current);
        silTimerRef.current = setTimeout(() => {
          const g = gainNodeRef.current, c = audioCtxRef.current;
          if (!g || !c) return;
          const t = c.currentTime;
          g.gain.cancelScheduledValues(t);
          g.gain.setValueAtTime(g.gain.value, t);
          g.gain.linearRampToValueAtTime(targetVol.current, t + 0.80);
          setIsDucked(false);
        }, 600);
      }
    };
    tick();
  }
  function toggleDuck() {
    const next = !duckEnabled; setDuckEnabled(next);
    if (!next) {
      _stopDuck(); setIsDucked(false);
      const gain = gainNodeRef.current, ctx = audioCtxRef.current;
      if (gain && ctx) {
        const now = ctx.currentTime;
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.linearRampToValueAtTime(targetVol.current, now + 0.40);
      }
    } else if (bgPlaying) startDucking();
  }

  async function playBg()  { await _playBg(); if (duckEnabled) startDucking(); }
  function pauseBg() { _pauseBg(); _stopDuck(); }
  function stopBg()  { _stopBg();  _stopDuck(); setIsDucked(false); }

  const drawWave = useCallback(() => {
    const canvas = canvasRef.current, anlyr = analyserRef.current;
    if (!canvas || !anlyr) return;
    const ctx2 = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const data = new Uint8Array(anlyr.frequencyBinCount);
    function draw() {
      animRef.current = requestAnimationFrame(draw);
      anlyr.getByteTimeDomainData(data);
      ctx2.clearRect(0, 0, W, H);
      const sl = W / data.length;
      ctx2.lineWidth = 2.5; ctx2.strokeStyle = '#0A84FF';
      ctx2.shadowBlur = 18; ctx2.shadowColor = 'rgba(10,132,255,.75)';
      ctx2.beginPath();
      data.forEach((v,i) => { const x=i*sl, y=((v-128)/128)*(H*.44)+H/2; i===0?ctx2.moveTo(x,y):ctx2.lineTo(x,y); });
      ctx2.stroke();
      ctx2.lineWidth = 1; ctx2.strokeStyle = 'rgba(71,161,255,.55)'; ctx2.shadowBlur = 0;
      ctx2.beginPath();
      data.forEach((v,i) => { const x=i*sl, y=((v-128)/128)*(H*.44)+H/2; i===0?ctx2.moveTo(x,y):ctx2.lineTo(x,y); });
      ctx2.stroke();
    }
    draw();
  }, []);

  async function startRec() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
      streamRef.current = stream;
      await ensureAudioCtx();
      const ctx = audioCtxRef.current;
      const anlyr = ctx.createAnalyser();
      anlyr.fftSize = 2048; anlyr.smoothingTimeConstant = 0.80;
      ctx.createMediaStreamSource(stream).connect(anlyr);
      analyserRef.current = anlyr;
      const dest = ctx.createMediaStreamDestination();
      destRef.current = dest;
      anlyr.connect(dest);
      try { gainNodeRef.current?.connect(dest); } catch(e) {}
      const mr = new MediaRecorder(dest.stream, { mimeType:'audio/webm;codecs=opus' });
      mrRef.current = mr;
      chunksRef.current = [];
      mr.ondataavailable = e => { if (e.data.size>0) chunksRef.current.push(e.data); };
      t0Ref.current = Date.now();
      mr.start(250);
      ivRef.current = setInterval(() =>
        setElapsed(Math.round((Date.now() - t0Ref.current) / 1000))
      , 500);
      drawWave();
      if (bgPlaying && duckEnabled) startDucking();
    } catch(e) { console.error('[ML] startRec:', e); }
  }

  async function endLoop() {
    clearInterval(ivRef.current);
    _stopDuck();
    cancelAnimationFrame(animRef.current);
    streamRef.current?.getTracks().forEach(t => t.stop());
    stopBg();
    const mr = mrRef.current;
    if (!mr || mr.state === 'inactive') { onEnd && onEnd(null); return; }
    mr.onstop = async () => {
      const blob = new Blob(chunksRef.current, { type:'audio/webm' });
      const dur  = Math.round((Date.now() - t0Ref.current) / 1000);
      const name = loop.title || `לופ ${new Date().toLocaleTimeString('he-IL')}`;
      try { await dbSave({ name, blob, duration:dur, host:loop.host }); } catch(e) {}
      const blobUrl = URL.createObjectURL(blob);
      onEnd && onEnd({
        id: `live-${Date.now()}`, title: name,
        host: loop.host || { name:'את/ה', avatar:'🎙' },
        dur, listeners: loop.listeners || 0, blobUrl,
      });
    };
    mr.stop();
  }

  function toggleMute() {
    streamRef.current?.getAudioTracks().forEach(t => { t.enabled = !t.enabled; });
    setMuted(m => !m);
  }

  /* Chat functions */
  function sendMsg() {
    if (!msgInput.trim()) return;
    const senderName = isRegistered ? (loop.host?.name || 'את/ה') : anonName.current;
    setMessages(prev => [...prev, { id:Date.now(), name:senderName, text:msgInput.trim(), time:fmt(elapsed) }]);
    setMsgInput('');
  }

  /* Reactions */
  function sendReaction(emoji) {
    const id = Date.now();
    const x = 15 + Math.random() * 65;
    setFloatEmojis(prev => [...prev, { id, emoji, x }]);
    setTimeout(() => setFloatEmojis(prev => prev.filter(e => e.id !== id)), 1000);
  }

  /* Rating / exit */
  function requestExit(type) {
    exitTypeRef.current = type;
    setShowRating(true);
  }
  function confirmExit() {
    setShowRating(false);
    if (exitTypeRef.current === 'end') endLoop();
    else onLeave && onLeave();
  }

  const volIcon = bgVolume === 0 ? '🔇' : bgVolume < 0.45 ? '🔉' : '🔊';
  const canStop = bgPlaying || bgPaused;

  return (
    <div style={{
      position:'fixed', inset:0,
      background:'linear-gradient(160deg,#07090F 0%,#0A1428 100%)',
      display:'flex', flexDirection:'column',
      maxWidth:'430px', margin:'0 auto',
      zIndex:500, overflowY:'auto',
    }}>

      {/* TOP BAR */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px 12px',borderBottom:'1px solid rgba(255,255,255,0.05)',flexShrink:0}}>
        {isHost ? (
          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#FF3B30',animation:'blink 1s ease-in-out infinite'}}/>
            <span style={{fontSize:'10px',fontWeight:700,letterSpacing:'2px',color:'#FF3B30'}}>REC</span>
            <span style={{fontSize:'13px',fontWeight:600,color:'rgba(255,255,255,.75)',fontVariantNumeric:'tabular-nums',marginRight:'4px'}}>{fmt(elapsed)}</span>
          </div>
        ) : (
          <button onClick={()=>requestExit('leave')} style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.09)',borderRadius:'999px',padding:'7px 14px',fontSize:'13px',fontWeight:500,color:'rgba(170,185,210,.70)',cursor:'pointer'}}>← עזוב</button>
        )}
        <div style={{display:'flex',gap:'3px',alignItems:'center'}}>
          {[1,2,3,4,5].map(i=><div key={i} className="wb"/>)}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          {/* Chat button — gated for unregistered */}
          <button onClick={()=> isRegistered ? setChatOpen(o=>!o) : setGateMsg('רוצה להשתתף בצ\'אט החי? בצע רישום מהיר בפרופיל')} style={{

            background:chatOpen?'rgba(10,132,255,0.18)':'rgba(255,255,255,0.05)',
            border:chatOpen?'1px solid rgba(10,132,255,0.38)':'1px solid rgba(255,255,255,0.09)',
            color:chatOpen?'#4DA8FF':'rgba(150,170,210,0.55)',
            fontSize:'15px',display:'flex',alignItems:'center',justifyContent:'center',
            position:'relative',transition:'all .18s',
          }}>
            {isRegistered ? '💬' : '🔒'}

            )}
          </button>
          <div style={{background:'rgba(255,59,48,.11)',border:'1px solid rgba(255,59,48,.28)',borderRadius:'999px',padding:'5px 12px',fontSize:'9px',fontWeight:700,letterSpacing:'2px',color:'#FF3B30'}}>LIVE</div>
        </div>
      </div>

      {/* TITLE */}
      <div style={{textAlign:'center',padding:'14px 24px 6px',flexShrink:0,fontSize:'16px',fontWeight:700,color:'#fff',lineHeight:1.36,letterSpacing:'-0.2px'}}>{loop.title}</div>

              background:muted?'rgba(255,59,48,.14)':'linear-gradient(135deg,rgba(10,132,255,.28),rgba(8,50,160,.18))',
              border:muted?'2px solid rgba(255,59,48,.55)':'2px solid rgba(10,132,255,.50)',
              display:'flex',alignItems:'center',justifyContent:'center',

              transition:'all .3s',marginBottom:'18px',position:'relative',zIndex:10,
            }}>
              {loop.host?.avatarUrl
                ? <img src={loop.host.avatarUrl} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>

                    {loop.host?.name ? loop.host.name.charAt(0).toUpperCase() : '🎙'}
                  </span>
