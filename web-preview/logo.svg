<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- Background: true dark with hairline border -->
  <rect width="44" height="44" rx="11" fill="#050810"/>
  <rect width="44" height="44" rx="11" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Subtle inner glow layer -->
  <radialGradient id="glow" cx="50%" cy="0%" r="80%">
    <stop offset="0%"   stop-color="rgba(10,132,255,0.08)"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <rect width="44" height="44" rx="11" fill="url(#glow)"/>

  <!--
    ML Monogram — single continuous thin stroke
    M: (7,33) up to (7,11) → diagonal to (17,22) → diagonal to (27,11) → down to (27,33)
    L: (27,33) right foot to (38,33)
    The right leg of M flows naturally into the vertical of L.
  -->
  <path d="M7 33 V11 L17 22 L27 11 V33 H38"
        stroke="#FFF9ED"
        stroke-width="1.75"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
