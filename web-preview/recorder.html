<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicLoop · Recorder</title>

  <!-- React 18 + Babel (CDN, no build step) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- IndexedDB wrapper — same DB as index.html / loop.html -->
  <script src="recordings.js"></script>

  <!-- Heebo (Hebrew-optimised) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      font-family: 'Heebo', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
      /* Faint blue radial at top */
      background-image: radial-gradient(ellipse 80% 35% at 50% -10%,
        rgba(10,132,255,0.10) 0%, transparent 70%);
    }
    #root { width: 100%; max-width: 420px; padding: 0 22px; }

    /* ── CSS-only animations (React className) ──────────────────── */
    @keyframes glow-blue {
      0%,100% {
        box-shadow: 0 0 36px rgba(10,132,255,0.35),
                    0 0 80px rgba(10,132,255,0.12);
      }
      50% {
        box-shadow: 0 0 56px rgba(10,132,255,0.65),
                    0 0 120px rgba(10,132,255,0.25);
      }
    }
    @keyframes glow-red {
      0%,100% {
        box-shadow: 0 0 36px rgba(255,59,48,0.35),
                    0 0 80px rgba(255,59,48,0.12);
      }
      50% {
        box-shadow: 0 0 56px rgba(255,59,48,0.65),
                    0 0 120px rgba(255,59,48,0.25);
      }
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.15; }
    }
    @keyframes slide-up {
      from { transform: translateY(28px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .glow-blue { animation: glow-blue 2.4s ease-in-out infinite; }
    .glow-red  { animation: glow-red  1.6s ease-in-out infinite; }
    .blink     { animation: blink     1.4s ease-in-out infinite; }
    .slide-up  { animation: slide-up  0.42s cubic-bezier(0.4,0,0.2,1); }
    .fade-in   { animation: fade-in   0.3s ease; }

    /* Smooth waveform canvas reveal */
    .canvas-wrap {
      transition: height 0.40s cubic-bezier(0.4,0,0.2,1),
                  opacity 0.30s ease,
                  margin-bottom 0.40s cubic-bezier(0.4,0,0.2,1);
    }

    /* Progress bar interaction */
    .progress-track {
      cursor: pointer;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-track:hover .progress-fill {
      filter: brightness(1.2);
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ── ML Monogram Logo ────────────────────────────────────────────── */
function MLLogo({ size = 44 }) {
  return (
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 44 44" width={size} height={size} style={{ flexShrink: 0 }}>
      <rect width="44" height="44" rx="11" fill="#050810"/>
      <rect width="44" height="44" rx="11" fill="none"
            stroke="rgba(255,255,255,0.12)" strokeWidth="1"/>
      {/* ML monogram: single continuous thin stroke */}
      <path d="M7 33 V11 L17 22 L27 11 V33 H38"
            stroke="#FFF9ED" strokeWidth="1.75"
            fill="none" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

/* ── Custom Audio Player ─────────────────────────────────────────── */
function AudioPlayer({ src, duration }) {
  const [playing,     setPlaying]     = useState(false);
  const [currentTime, setCurrentTime] = useState(0);
  const audioRef = useRef(null);

  const pad     = n => String(n).padStart(2, '0');
  const fmtTime = s => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
  const total   = duration || 0;
  const pct     = total > 0 ? (currentTime / total) * 100 : 0;

  useEffect(() => {
    const el = audioRef.current;
    if (!el) return;
    const onTime = () => setCurrentTime(el.currentTime);
    const onEnd  = () => { setPlaying(false); setCurrentTime(0); };
    el.addEventListener('timeupdate', onTime);
    el.addEventListener('ended',      onEnd);
    return () => {
      el.removeEventListener('timeupdate', onTime);
      el.removeEventListener('ended',      onEnd);
    };
  }, []);

  function togglePlay() {
    const el = audioRef.current;
    if (!el) return;
    if (playing) {
      el.pause();
      setPlaying(false);
    } else {
      el.play()
        .then(() => setPlaying(true))
        .catch(err => {
          console.error('[MicLoop] Play failed:', err);
          alert('שגיאה בהשמעה: ' + err.message);
        });
    }
  }

  function seek(e) {
    const el   = audioRef.current;
    if (!el || !total) return;
    const rect  = e.currentTarget.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    el.currentTime = ratio * total;
    setCurrentTime(el.currentTime);
  }

  return (
    <div>
      <audio ref={audioRef} src={src} preload="auto" style={{ display: 'none' }} />

      <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>

        {/* Play / Pause capsule button */}
        <button
          onClick={togglePlay}
          style={{
            width: '52px', height: '52px', borderRadius: '50%',
            background: playing
              ? 'rgba(10,132,255,0.22)' : 'rgba(10,132,255,0.14)',
            border: '1px solid rgba(10,132,255,0.40)',
            color: '#4DA8FF', fontSize: '18px',
            cursor: 'pointer', flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'all 0.24s',
            boxShadow: playing ? '0 0 28px rgba(10,132,255,0.30)' : 'none',
          }}
        >
          {playing ? '⏸' : '▶'}
        </button>

        {/* Progress + time */}
        <div style={{ flex: 1 }}>
          {/* Track */}
          <div
            className="progress-track"
            onClick={seek}
            style={{
              width: '100%', height: '3px',
              background: 'rgba(255,255,255,0.09)',
              marginBottom: '8px',
            }}
          >
            <div
              className="progress-fill"
              style={{
                height: '100%',
                width: `${pct}%`,
                background: 'linear-gradient(90deg, #0A84FF, #4DA8FF)',
                borderRadius: '999px',
                transition: 'width 0.3s linear',
              }}
            />
          </div>
          {/* Times */}
          <div style={{
            display: 'flex', justifyContent: 'space-between',
            fontFamily: 'Heebo, sans-serif',
            fontSize: '11px', fontWeight: 300,
            color: 'rgba(128,148,184,0.7)',
            fontVariantNumeric: 'tabular-nums',
          }}>
            <span>{fmtTime(currentTime)}</span>
            <span>{fmtTime(total)}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Main Recorder Component ─────────────────────────────────────── */
function MicloopRecorder() {
  // 'idle' | 'recording' | 'stopped'
  const [status,      setStatus]      = useState('idle');
  const [blobUrl,     setBlobUrl]     = useState(null);
  const [elapsed,     setElapsed]     = useState(0);
  const [recDuration, setRecDuration] = useState(0);
  const [recName,     setRecName]     = useState('');

  const mediaRecorderRef = useRef(null);
  const chunksRef        = useRef([]);
  const streamRef        = useRef(null);
  const analyserRef      = useRef(null);
  const audioCtxRef      = useRef(null);
  const animFrameRef     = useRef(null);
  const canvasRef        = useRef(null);
  const startTimeRef     = useRef(null);
  const intervalRef      = useRef(null);

  /* ── Elapsed timer ─────────────────────────────────────────────── */
  useEffect(() => {
    if (status === 'recording') {
      intervalRef.current = setInterval(() => {
        setElapsed(Math.round((Date.now() - (startTimeRef.current || Date.now())) / 1000));
      }, 500);
    }
    return () => clearInterval(intervalRef.current);
  }, [status]);

  /* ── Waveform draw loop ────────────────────────────────────────── */
  const drawWaveform = useCallback(() => {
    const canvas   = canvasRef.current;
    const analyser = analyserRef.current;
    if (!canvas || !analyser) return;

    const ctx       = canvas.getContext('2d');
    const W         = canvas.width;
    const H         = canvas.height;
    const bufLen    = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufLen);

    function draw() {
      animFrameRef.current = requestAnimationFrame(draw);
      analyser.getByteTimeDomainData(dataArray);

      /* Clear to transparent */
      ctx.clearRect(0, 0, W, H);

      /* ── Waveform: thick glow line ── */
      ctx.lineWidth   = 2.5;
      ctx.strokeStyle = '#0A84FF';
      ctx.shadowBlur  = 18;
      ctx.shadowColor = 'rgba(10,132,255,0.75)';
      ctx.beginPath();
      const slice = W / bufLen;
      let x = 0;
      for (let i = 0; i < bufLen; i++) {
        const y = ((dataArray[i] / 128.0) * H) / 2;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        x += slice;
      }
      ctx.lineTo(W, H / 2);
      ctx.stroke();

      /* ── Second pass: thin highlight line ── */
      ctx.lineWidth   = 1;
      ctx.strokeStyle = 'rgba(77,168,255,0.55)';
      ctx.shadowBlur  = 6;
      ctx.shadowColor = 'rgba(10,132,255,0.40)';
      ctx.beginPath();
      x = 0;
      for (let i = 0; i < bufLen; i++) {
        const y = ((dataArray[i] / 128.0) * H) / 2;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        x += slice;
      }
      ctx.lineTo(W, H / 2);
      ctx.stroke();
    }
    draw();
  }, []);

  /* ── Start recording ───────────────────────────────────────────── */
  async function startRecording() {
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    setBlobUrl(null);
    setElapsed(0);

    /* Guard: browser support */
    if (!navigator.mediaDevices?.getUserMedia) {
      alert('הדפדפן שלך אינו תומך בהקלטת שמע. נסה Chrome / Firefox / Safari עדכני.');
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        alert('גישה למיקרופון נדחתה.\nאנא לחץ על סמל המנעול בשורת הכתובת ואפשר גישה למיקרופון.');
      } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        alert('לא נמצא מיקרופון במכשיר זה.\nחבר מיקרופון ונסה שנית.');
      } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
        alert('המיקרופון תפוס על ידי אפליקציה אחרת.\nסגור את האפליקציה האחרת ונסה שנית.');
      } else {
        alert('שגיאה בגישה למיקרופון: ' + err.message);
      }
      console.error('[MicLoop] getUserMedia error:', err);
      return;
    }
    streamRef.current = stream;

    /* Web Audio analyser (for waveform only — no playback) */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtxRef.current = audioCtx;
    const src      = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize        = 1024;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    analyserRef.current = analyser;

    /* MediaRecorder */
    const mimeType = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4']
      .find(t => MediaRecorder.isTypeSupported(t)) || '';
    const mr = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    mediaRecorderRef.current = mr;
    chunksRef.current = [];

    mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };

    mr.onstop = async () => {
      /* ✅ Stop tracks HERE — after all chunks are collected */
      streamRef.current?.getTracks().forEach(t => t.stop());
      streamRef.current = null;

      cancelAnimationFrame(animFrameRef.current);
      audioCtx.close();

      const finalMime = mr.mimeType || 'audio/webm';
      const blob      = new Blob(chunksRef.current, { type: finalMime });

      /* Diagnostic — visible in DevTools console */
      console.log('[MicLoop] Recording complete:', {
        chunks:   chunksRef.current.length,
        blobSize: blob.size,
        mimeType: finalMime,
      });

      /* Guard: empty blob means no audio was captured */
      if (blob.size === 0) {
        showToast('⚠️ ההקלטה ריקה — בדוק הרשאות מיקרופון');
        console.error('[MicLoop] Blob is empty — microphone permission may be missing or audio chunks were not collected.');
        setStatus('idle');
        return;
      }

      const url = URL.createObjectURL(blob);
      const dur       = Math.round((Date.now() - startTimeRef.current) / 1000);
      const hhmm      = new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
      const name      = `הקלטה · ${hhmm}`;

      /* Save to IndexedDB — same DB as index.html "הלופים שלי" */
      try {
        await saveRecording({ blob, name, duration: dur, mimeType: finalMime });
        showToast('✅ נשמר ב"הלופים שלי"');
      } catch {
        showToast('⚠️ שגיאה בשמירה');
      }

      setBlobUrl(url);
      setRecDuration(dur);
      setRecName(name);
      setStatus('stopped');
    };

    mr.start(100);
    startTimeRef.current = Date.now();
    setStatus('recording');

    /* Give AudioContext one frame to initialise before drawing */
    requestAnimationFrame(drawWaveform);
  }

  /* ── Stop recording ────────────────────────────────────────────── */
  function stopRecording() {
    clearInterval(intervalRef.current);
    const mr = mediaRecorderRef.current;
    if (!mr || mr.state === 'inactive') return;
    /* requestData() flushes the current audio chunk before stop() fires */
    if (mr.state === 'recording') mr.requestData();
    /* Tracks are stopped inside onstop — not here — to avoid losing the final chunk */
    mr.stop();
  }

  function handleButton() {
    if (status === 'recording') stopRecording();
    else startRecording();
  }

  function resetRecorder() {
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    setBlobUrl(null);
    setStatus('idle');
    setElapsed(0);
    startTimeRef.current = null;
  }

  /* ── Toast ─────────────────────────────────────────────────────── */
  const toastTimerRef = useRef(null);
  function showToast(msg) {
    let el = document.getElementById('rec-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'rec-toast';
      Object.assign(el.style, {
        position: 'fixed', bottom: '32px', left: '50%',
        transform: 'translateX(-50%) translateY(20px)',
        background: '#0E1628',
        border: '1px solid rgba(255,255,255,0.10)',
        color: '#fff',
        fontFamily: 'Heebo, sans-serif',
        fontSize: '14px', fontWeight: 500,
        padding: '12px 22px',
        borderRadius: '999px',
        opacity: '0',
        transition: 'all 0.3s cubic-bezier(0.4,0,0.2,1)',
        pointerEvents: 'none',
        whiteSpace: 'nowrap',
        zIndex: '999',
        boxShadow: '0 8px 32px rgba(0,0,0,0.5)',
      });
      document.body.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => {
      el.style.opacity   = '1';
      el.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => {
      el.style.opacity   = '0';
      el.style.transform = 'translateX(-50%) translateY(20px)';
    }, 3200);
  }

  const pad     = n => String(n).padStart(2, '0');
  const fmtTime = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;

  const isRecording = status === 'recording';
  const isStopped   = status === 'stopped';

  /* ── Render ──────────────────────────────────────────────────────── */
  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      padding: '48px 0',
    }}>

      {/* ── Header ───────────────────────────────────────────── */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: '14px',
        marginBottom: '64px',
      }}>
        <MLLogo size={42} />
        <span style={{
          fontFamily: 'Heebo, sans-serif',
          fontSize: '13px', fontWeight: 600,
          letterSpacing: '6px', textTransform: 'uppercase',
          color: '#fff',
        }}>
          MicLoop
        </span>
      </div>

      {/* ── Live waveform canvas (shows only while recording) ─── */}
      <div
        className="canvas-wrap"
        style={{
          width: '100%',
          height: isRecording ? '88px' : '0px',
          opacity: isRecording ? 1 : 0,
          marginBottom: isRecording ? '40px' : '0px',
          borderRadius: '18px',
          overflow: 'hidden',
          background: 'rgba(8,12,24,0.72)',
          border: isRecording
            ? '1px solid rgba(10,132,255,0.16)'
            : '1px solid transparent',
          backdropFilter: 'blur(20px)',
        }}
      >
        {/* Canvas buffer 2× for retina sharpness */}
        <canvas
          ref={canvasRef}
          width={840}
          height={176}
          style={{ width: '100%', height: '88px', display: 'block' }}
        />
      </div>

      {/* ── Timer ────────────────────────────────────────────── */}
      {!isStopped && (
        <div style={{
          display: 'flex', alignItems: 'center', gap: '9px',
          fontFamily: 'Heebo, sans-serif',
          fontSize: '16px', fontWeight: 700,
          color: isRecording ? '#FF3B30' : 'rgba(255,255,255,0.18)',
          letterSpacing: '3px',
          fontVariantNumeric: 'tabular-nums',
          marginBottom: '36px',
          minHeight: '24px',
        }}>
          {isRecording && (
            <span className="blink" style={{
              width: '7px', height: '7px', borderRadius: '50%',
              background: '#FF3B30',
              boxShadow: '0 0 9px rgba(255,59,48,0.9)',
              display: 'inline-block', flexShrink: 0,
            }} />
          )}
          {fmtTime(elapsed)}
        </div>
      )}

      {/* ── Record / Stop button ─────────────────────────────── */}
      {!isStopped && (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '16px' }}>
          <button
            onClick={handleButton}
            className={isRecording ? 'glow-red' : 'glow-blue'}
            style={{
              width: '96px', height: '96px',
              borderRadius: '50%',
              background: isRecording
                ? 'radial-gradient(circle at 38% 35%, rgba(255,80,68,0.22), rgba(160,20,14,0.12))'
                : 'radial-gradient(circle at 38% 35%, rgba(30,110,255,0.22), rgba(8,60,180,0.10))',
              border: isRecording
                ? '1px solid rgba(255,59,48,0.42)'
                : '1px solid rgba(10,132,255,0.42)',
              color: '#fff',
              fontSize: '36px',
              cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              backdropFilter: 'blur(12px)',
              transition: 'background 0.3s, border-color 0.3s',
              outline: 'none',
            }}
          >
            {isRecording ? '⏹' : '🎙'}
          </button>

          <span style={{
            fontFamily: 'Heebo, sans-serif',
            fontSize: '13px', fontWeight: 300,
            letterSpacing: '0.3px',
            color: isRecording
              ? 'rgba(255,80,72,0.70)'
              : 'rgba(77,168,255,0.65)',
          }}>
            {isRecording ? 'לחץ לעצירת ההקלטה' : 'לחץ להתחלת הקלטה'}
          </span>
        </div>
      )}

      {/* ── Glassmorphism player card ─────────────────────────── */}
      {isStopped && blobUrl && (
        <div
          className="slide-up"
          style={{
            width: '100%',
            background: 'rgba(8,12,24,0.72)',
            backdropFilter: 'blur(32px) saturate(160%)',
            WebkitBackdropFilter: 'blur(32px) saturate(160%)',
            border: '1px solid rgba(10,132,255,0.14)',
            borderRadius: '24px',
            padding: '28px 26px 24px',
            boxShadow: [
              '0 32px 80px rgba(0,0,0,0.65)',
              '0 0 0 1px rgba(10,132,255,0.05)',
              '0 0 60px rgba(10,132,255,0.06)',
            ].join(', '),
          }}
        >
          {/* Card header */}
          <div style={{
            display: 'flex', justifyContent: 'space-between',
            alignItems: 'flex-start', marginBottom: '20px',
          }}>
            <div>
              <div style={{
                fontFamily: 'Heebo, sans-serif',
                fontSize: '17px', fontWeight: 700,
                color: '#fff', letterSpacing: '-0.3px',
                marginBottom: '5px',
              }}>
                {recName}
              </div>
              <div style={{
                fontFamily: 'Heebo, sans-serif',
                fontSize: '12px', fontWeight: 300,
                color: 'rgba(128,148,184,0.75)',
              }}>
                {fmtTime(recDuration)} · הקלטה מקומית
              </div>
            </div>

            {/* Status pill */}
            <div style={{
              background: 'rgba(48,209,88,0.09)',
              border: '1px solid rgba(48,209,88,0.22)',
              borderRadius: '9999px',
              padding: '5px 14px',
              fontFamily: 'Heebo, sans-serif',
              fontSize: '10px', fontWeight: 700,
              letterSpacing: '1.4px',
              color: '#30D158',
              whiteSpace: 'nowrap',
              alignSelf: 'flex-start',
            }}>
              READY
            </div>
          </div>

          {/* Divider */}
          <div style={{
            height: '1px',
            background: 'rgba(255,255,255,0.06)',
            marginBottom: '20px',
          }} />

          {/* Custom audio player */}
          <AudioPlayer src={blobUrl} duration={recDuration} />

          {/* Row: reset + go to library */}
          <div style={{ display: 'flex', gap: '10px', marginTop: '20px' }}>

            {/* Record again */}
            <button
              onClick={resetRecorder}
              style={{
                flex: 1,
                background: 'rgba(255,255,255,0.04)',
                border: '1px solid rgba(255,255,255,0.08)',
                borderRadius: '9999px',
                padding: '13px',
                fontFamily: 'Heebo, sans-serif',
                fontSize: '14px', fontWeight: 500,
                color: 'rgba(128,148,184,0.75)',
                cursor: 'pointer',
                transition: 'all 0.24s',
              }}
              onMouseEnter={e => {
                e.currentTarget.style.background  = 'rgba(10,132,255,0.10)';
                e.currentTarget.style.borderColor = 'rgba(10,132,255,0.28)';
                e.currentTarget.style.color       = '#4DA8FF';
              }}
              onMouseLeave={e => {
                e.currentTarget.style.background  = 'rgba(255,255,255,0.04)';
                e.currentTarget.style.borderColor = 'rgba(255,255,255,0.08)';
                e.currentTarget.style.color       = 'rgba(128,148,184,0.75)';
              }}
            >
              🎙 הקלט שוב
            </button>

            {/* Go to My Recordings */}
            <a
              href="index.html#my-recordings-section"
              style={{
                flex: 1,
                background: 'rgba(10,132,255,0.12)',
                border: '1px solid rgba(10,132,255,0.28)',
                borderRadius: '9999px',
                padding: '13px',
                fontFamily: 'Heebo, sans-serif',
                fontSize: '14px', fontWeight: 600,
                color: '#4DA8FF',
                cursor: 'pointer',
                transition: 'all 0.24s',
                textDecoration: 'none',
                textAlign: 'center',
                display: 'block',
              }}
              onMouseEnter={e => {
                e.currentTarget.style.background  = 'rgba(10,132,255,0.22)';
                e.currentTarget.style.borderColor = 'rgba(10,132,255,0.50)';
                e.currentTarget.style.color       = '#fff';
              }}
              onMouseLeave={e => {
                e.currentTarget.style.background  = 'rgba(10,132,255,0.12)';
                e.currentTarget.style.borderColor = 'rgba(10,132,255,0.28)';
                e.currentTarget.style.color       = '#4DA8FF';
              }}
            >
              📂 הלופים שלי →
            </a>
          </div>
        </div>
      )}

    </div>
  );
}

/* ── Mount ───────────────────────────────────────────────────────── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MicloopRecorder />);
</script>
</body>
</html>
